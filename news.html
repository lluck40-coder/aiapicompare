<style>
  h2{font-size:1.15rem;margin:1.8rem 0 .6rem}
  .tabs{display:flex;flex-wrap:wrap;gap:.35rem;margin:.2rem 0 .8rem}
  .tabs button{padding:.35rem .75rem;border:1px solid var(--border2);border-radius:2rem;background:var(--input);cursor:pointer;font-size:.82rem;color:var(--muted)}
  .tabs button.active{border-color:var(--accent);color:var(--accent);background:var(--accent-bg);font-weight:600}
  td.num,th.num{text-align:right}
  .price{font-family:var(--mono);white-space:nowrap}
  .datum{white-space:nowrap;color:var(--dim);font-size:.82rem;width:6.5rem}
  .pz{display:inline-block;padding:.05rem .45rem;border-radius:.3rem;font-size:.75rem;font-weight:700;font-family:var(--mono)}
  .pz.down{background:var(--accent-bg);color:var(--accent)}
  .pz.up{background:rgba(248,113,113,.15);color:#f87171}
  .alt{color:var(--dim);text-decoration:line-through;margin-right:.3rem}

  .links a{display:flex;align-items:center;gap:.5rem;padding:.6rem .8rem;border:1px solid var(--border2);border-radius:.55rem;text-decoration:none;color:var(--fg);background:var(--input)}
  .links a:hover{border-color:var(--accent)}
  .links small{color:var(--dim);font-size:.72rem;margin-left:auto}
  .hinweis{font-size:.78rem;color:var(--dim);margin-top:.6rem;line-height:1.6}
  a.mlink{color:var(--fg);text-decoration:none;font-weight:600}
  a.mlink:hover{color:var(--accent);text-decoration:underline}

<script src="out/data.js"></script>
<script src="out/news.js"></script>
<script>
"use strict";
const D = window.API_DATEN || {};
const N = window.NEWS || null;
const QUELLEN = {openrouter:"OpenRouter", uplinkswitch:"UplinkSwitch", anymodel:"AnyModel", nanogpt:"NanoGPT", chutes:"Chutes",
  deepinfra:"DeepInfra", novita:"Novita AI", cometapi:"CometAPI", kyma:"Kyma API"};
const FARBE = {openrouter:"#a78bfa", uplinkswitch:"#f472b6", anymodel:"#fbbf24", nanogpt:"#34d399", chutes:"#f87171",
  deepinfra:"#60a5fa", novita:"#2dd4bf", cometapi:"#fb923c", kyma:"#c084fc"};

const L10N = {
de:{h1:"Neuigkeiten: neue Modelle & Preisänderungen",
  lead:"Was sich in den letzten 30 Tagen bei den KI-API-Anbietern getan hat – automatisch ermittelt aus unseren täglichen Preisabfragen.",
  nav_vergleich:"Preisvergleich", nav_kosten:"Kostenrechner", nav_gratis:"Kostenlose Modelle", nav_best:"Bestenliste", nav_news:"Neuigkeiten", nav_anbindung:"Anbindung & Einrichtung", impressum:"Impressum", datenschutz:"Datenschutz",
  h_preis:"Preisänderungen", h_neu:"Neue Modelle", h_offiziell:"Offizielle Neuigkeiten der Anbieter",
  offiziell_text:"Ankündigungen, Forschung und neue Modelle direkt auf den Seiten der Hersteller (externe Links):",
  tabs:{alle:"Alle", down:"↓ Günstiger geworden", up:"↑ Teurer geworden"},
  pth:["Datum","Modell","Anbieter","Preis vorher → jetzt","Änderung"], nth:["Seit","Modell","Anbieter","Preis"],
  einheit:{text:"/ 1M Input", image:"/ Bild", second:"/ s", generation:"/ Video"}, gratis:"kostenlos",
  leer_p:"Keine Preisänderungen in den letzten 30 Tagen.", leer_n:"Keine neuen Modelle in den letzten 30 Tagen.",
  keine:"Die Neuigkeiten werden beim nächsten täglichen Datenabruf erstellt.",
  stand:function(d){ return "Stand der Preisdaten: " + d + " · Preise in USD · Angaben ohne Gewähr, maßgeblich ist die Seite des Anbieters."; }},
en:{h1:"News: new models & price changes",
  lead:"What changed at AI API providers in the last 30 days – generated automatically from our daily price checks.",
  nav_vergleich:"Price comparison", nav_kosten:"Cost calculator", nav_gratis:"Free models", nav_best:"Leaderboard", nav_news:"News", nav_anbindung:"Setup & integration", impressum:"Imprint", datenschutz:"Privacy",
  h_preis:"Price changes", h_neu:"New models", h_offiziell:"Official news from the providers",
  offiziell_text:"Announcements, research and new models directly on the vendors’ websites (external links):",
  tabs:{alle:"All", down:"↓ Cheaper", up:"↑ More expensive"},
  pth:["Date","Model","Provider","Price before → now","Change"], nth:["Since","Model","Provider","Price"],
  einheit:{text:"/ 1M input", image:"/ image", second:"/ s", generation:"/ video"}, gratis:"free",
  leer_p:"No price changes in the last 30 days.", leer_n:"No new models in the last 30 days.",
  keine:"The news will be created with the next daily data update.",
  stand:function(d){ return "Price data as of " + d + " · Prices in USD · No guarantee, the provider’s website is authoritative."; }},
zh:{h1:"动态：新模型与价格变化",
  lead:"过去 30 天 AI API 提供商的变化——根据我们每日的价格查询自动生成。",
  nav_vergleich:"价格对比", nav_kosten:"成本计算器", nav_gratis:"免费模型", nav_best:"排行榜", nav_news:"动态", nav_anbindung:"接入与配置", impressum:"网站信息", datenschutz:"隐私政策",
  h_preis:"价格变化", h_neu:"新模型", h_offiziell:"提供商官方动态",
  offiziell_text:"直接前往各厂商网站查看公告、研究与新模型（外部链接）：",
  tabs:{alle:"全部", down:"↓ 降价", up:"↑ 涨价"},
  pth:["日期","模型","提供商","原价 → 现价","变化"], nth:["上线","模型","提供商","价格"],
  einheit:{text:"/ 百万输入", image:"/ 张", second:"/ 秒", generation:"/ 视频"}, gratis:"免费",
  leer_p:"过去 30 天没有价格变化。", leer_n:"过去 30 天没有新模型。",
  keine:"动态将在下一次每日数据更新时生成。",
  stand:function(d){ return "价格数据日期：" + d + " · 价格单位为美元 · 仅供参考，以提供商网站为准。"; }},
ru:{h1:"Новости: новые модели и изменения цен",
  lead:"Что изменилось у поставщиков AI-API за последние 30 дней – автоматически по нашим ежедневным проверкам цен.",
  nav_vergleich:"Сравнение цен", nav_kosten:"Калькулятор", nav_gratis:"Бесплатные модели", nav_best:"Рейтинг", nav_news:"Новости", nav_anbindung:"Подключение", impressum:"Импрессум", datenschutz:"Конфиденциальность",
  h_preis:"Изменения цен", h_neu:"Новые модели", h_offiziell:"Официальные новости поставщиков",
  offiziell_text:"Анонсы, исследования и новые модели прямо на сайтах разработчиков (внешние ссылки):",
  tabs:{alle:"Все", down:"↓ Подешевело", up:"↑ Подорожало"},
  pth:["Дата","Модель","Поставщик","Цена было → стало","Изменение"], nth:["С","Модель","Поставщик","Цена"],
  einheit:{text:"/ 1 млн вход", image:"/ изобр.", second:"/ с", generation:"/ видео"}, gratis:"бесплатно",
  leer_p:"Нет изменений цен за последние 30 дней.", leer_n:"Нет новых моделей за последние 30 дней.",
  keine:"Новости появятся при следующем ежедневном обновлении данных.",
  stand:function(d){ return "Цены на " + d + " · в USD · Без гарантии, действует информация на сайте поставщика."; }}
};

function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
let lang = lsGet("lang") || (navigator.language || "").slice(0,2);
if (!L10N[lang]) lang = "en";
let filter = "alle";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtP(n){ return "$" + (n >= 100 ? n.toFixed(0) : n >= 1 ? n.toFixed(2) : n >= 0.01 ? n.toFixed(3) : n.toFixed(4)); }
function sauber(n){ return String(n || "").replace(/^[^:]{1,30}:\s*/, ""); }
function einheit(e, T){ return T.einheit[e] || T.einheit.text; }
function anb(q){ return '<span class="dot" style="background:'+(FARBE[q]||"#888")+'"></span>'+esc(QUELLEN[q] || q); }
function datum(d){ try { return new Date(d + "T00:00:00Z").toLocaleDateString(lang === "zh" ? "zh-CN" : lang, {day:"2-digit", month:"2-digit", year:"numeric", timeZone:"UTC"}); } catch(e){ return d; } }
function modell(x){ return '<a class="mlink" href="index.html#q='+encodeURIComponent(sauber(x.n).replace(/\s*\((free|batch)\)\s*$/i, ""))+'">'+esc(sauber(x.n))+'</a>'; }

function render(){
  const T = L10N[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  document.title = T.h1 + " – aiapicompare";
  document.querySelectorAll("[data-t]").forEach(function(el){ el.textContent = T[el.dataset.t]; });
  document.querySelectorAll(".langbtns button").forEach(function(b){ b.classList.toggle("active", b.dataset.lang === lang); });
  document.getElementById("ptabs").innerHTML = Object.keys(T.tabs).map(function(k){
    return '<button data-f="'+k+'" class="'+(k === filter ? "active" : "")+'">'+T.tabs[k]+'</button>'; }).join("");
  document.getElementById("phead").innerHTML = '<tr>'+T.pth.map(function(x,i){ return '<th'+(i>=3?' class="num"':'')+'>'+x+'</th>'; }).join("")+'</tr>';
  document.getElementById("nhead").innerHTML = '<tr>'+T.nth.map(function(x,i){ return '<th'+(i>=3?' class="num"':'')+'>'+x+'</th>'; }).join("")+'</tr>';
  if (!N){
    document.getElementById("pbody").innerHTML = '<tr><td colspan="5" class="leer">'+T.keine+'</td></tr>';
    document.getElementById("nbody").innerHTML = '<tr><td colspan="4" class="leer">'+T.keine+'</td></tr>';
    return;
  }
  const preis = N.preis.filter(function(x){ return filter === "alle" || (filter === "down" ? x.neu < x.alt : x.neu > x.alt); });
  document.getElementById("pbody").innerHTML = preis.length ? preis.map(function(x){
    const down = x.neu < x.alt;
    return '<tr><td class="datum">'+datum(x.d)+'</td><td>'+modell(x)+'</td><td>'+anb(x.q)+'</td>'+
      '<td class="num"><span class="price alt">'+fmtP(x.alt)+'</span><span class="price">'+fmtP(x.neu)+'</span> <span class="unit">'+einheit(x.e, T)+'</span></td>'+
      '<td class="num"><span class="pz '+(down ? "down" : "up")+'">'+(down ? "↓ " : "↑ +")+(x.pz !== null ? Math.abs(x.pz) + " %" : "")+'</span></td></tr>';
  }).join("") : '<tr><td colspan="5" class="leer">'+T.leer_p+'</td></tr>';
  document.getElementById("nbody").innerHTML = N.neu.length ? N.neu.map(function(x){
    let p = "—";
    if (x.g) p = T.gratis;
    else if (typeof x.in === "number") p = fmtP(x.in) + ' <span class="unit">'+T.einheit.text+'</span>';
    else if (typeof x.ab === "number") p = fmtP(x.ab) + ' <span class="unit">'+T.einheit.text+'</span>';
    else if (typeof x.mp === "number") p = fmtP(x.mp) + ' <span class="unit">'+einheit(x.e, T)+'</span>';
    return '<tr><td class="datum">'+datum(x.d)+'</td><td>'+modell(x)+'</td><td>'+anb(x.q)+'</td><td class="num price">'+p+'</td></tr>';
  }).join("") : '<tr><td colspan="4" class="leer">'+T.leer_n+'</td></tr>';
  document.getElementById("stand").textContent = T.stand(N.stand || "");
}
document.addEventListener("click", function(e){
  const l = e.target.closest("button[data-lang]");
  if (l){ lang = l.dataset.lang; lsSet("lang", lang); render(); return; }
  const f = e.target.closest("button[data-f]");
  if (f){ filter = f.dataset.f; render(); }
});
render();
</script>
</body>
</html>
