  [data-theme=light] .viz{--c1:#2a78d6;--c2:#eb6834}
  .viz h2{font-size:1rem;margin:0 0 .3rem}
  .legende{display:flex;gap:1.2rem;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:.2rem 0 .4rem}
  .legende i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:.4rem;vertical-align:3px}

  .achse text{fill:var(--dim);font-size:11px;font-family:var(--mono)}

  .tip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--border2);border-radius:.45rem;padding:.45rem .6rem;font-size:.78rem;line-height:1.5;color:var(--fg);box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:5;white-space:nowrap}

  nav_vergleich:"Price comparison", nav_kosten:"Cost calculator", nav_finder:"Model finder", nav_gratis:"Free models", nav_best:"Leaderboard", nav_news:"News", nav_anbindung:"Setup & integration", impressum:"Imprint", datenschutz:"Privacy",
  chart_titel:"Price index (start day = 100)", reihe_alle:"All text models", reihe_top:"Top 30 of the Arena leaderboard",
  k_alle:"Index all text models", k_top:"Index top models", k_seit:"since", k_korb:"Models in the basket",
  h_monate:"Monthly overview", mth:["Month","Price cuts","Price increases","New models"], h_methode:"How the index is calculated",
  leer:function(d){ return "The index starts on " + d + ". A trend becomes visible as soon as prices change – the data grows every day."; },
  keine:"The price index will be created with the next daily data update.",
  methode:function(p){ return "Basket: all text models with an input price above 0 that have been tracked since the start day (" + p.start + ") (" + p.n_alle + " model–provider combinations). For each day, the price of each combination is divided by its price on the start day; the index is the geometric mean of these ratios × 100. A value of 90 means: on average 10 % cheaper than on the start day. The second series only uses models in the top 30 of the Arena leaderboard (overall) (" + p.n_top + " combinations; ranks: Arena, CC BY 4.0). Based on list prices in USD excluding taxes; no guarantee."; }},
zh:{h1:"AI 价格指数：API 价格如何变化？", lead:"我们的指数显示 AI 模型 API 价格随时间的变化——根据我们对所有提供商的每日价格查询计算。",
  nav_vergleich:"价格对比", nav_kosten:"成本计算器", nav_finder:"模型推荐", nav_gratis:"免费模型", nav_best:"排行榜", nav_news:"动态", nav_anbindung:"接入与配置", impressum:"网站信息", datenschutz:"隐私政策",
  chart_titel:"价格指数（起始日 = 100）", reihe_alle:"全部文本模型", reihe_top:"Arena 排行榜前 30",
  k_alle:"全部文本模型指数", k_top:"顶级模型指数", k_seit:"自", k_korb:"篮子中的模型",
  h_monate:"每月概览", mth:["月份","降价","涨价","新模型"], h_methode:"指数计算方法",
  leer:function(d){ return "指数从 " + d + " 开始。价格一旦变化即可看到趋势——数据每天都在增加。"; },
  keine:"价格指数将在下一次每日数据更新时生成。",

ru:{h1:"Индекс цен AI: как меняются цены API?", lead:"Наш индекс показывает, как со временем меняются цены на AI-модели через API – ежедневно по нашим собственным проверкам цен у всех поставщиков.",
  nav_vergleich:"Сравнение цен", nav_kosten:"Калькулятор", nav_finder:"Подбор модели", nav_gratis:"Бесплатные модели", nav_best:"Рейтинг", nav_news:"Новости", nav_anbindung:"Подключение", impressum:"Импрессум", datenschutz:"Конфиденциальность",
  chart_titel:"Индекс цен (стартовый день = 100)", reihe_alle:"Все текстовые модели", reihe_top:"Топ-30 рейтинга Arena",
  k_alle:"Индекс всех текстовых моделей", k_top:"Индекс топ-моделей", k_seit:"с", k_korb:"Моделей в корзине",
  h_monate:"По месяцам", mth:["Месяц","Снижения цен","Повышения цен","Новые модели"], h_methode:"Как рассчитывается индекс",
  leer:function(d){ return "Индекс начинается " + d + ". Тренд станет виден, как только изменятся цены – данные растут каждый день."; },
  keine:"Индекс цен будет создан при следующем ежедневном обновлении данных.",
  methode:function(p){ return "Корзина: все текстовые модели с ценой ввода выше 0, отслеживаемые со стартового дня (" + p.start + ") (" + p.n_alle + " комбинаций модель–поставщик). Для каждого дня цена каждой комбинации делится на её цену в стартовый день; индекс – среднее геометрическое этих отношений × 100. Значение 90 означает: в среднем на 10 % дешевле, чем в стартовый день. Вторая линия – только модели из топ-30 рейтинга Arena (в целом) (" + p.n_top + " комбинаций; места: Arena, CC BY 4.0). Основа – прайсовые цены в USD без налогов; без гарантии."; }}
};
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
let lang = lsGet("lang") || (navigator.language || "").slice(0,2);
if (!L10N[lang]) lang = "en";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function datum(d, kurz){ try { return new Date(d + "T00:00:00Z").toLocaleDateString(lang === "zh" ? "zh-CN" : lang, kurz ? {day:"2-digit", month:"2-digit", timeZone:"UTC"} : {day:"2-digit", month:"2-digit", year:"numeric", timeZone:"UTC"}); } catch(e){ return d; } }
function monat(m){ try { return new Date(m + "-01T00:00:00Z").toLocaleDateString(lang === "zh" ? "zh-CN" : lang, {month:"long", year:"numeric", timeZone:"UTC"}); } catch(e){ return m; } }
function wert(x){ return x === null || x === undefined ? "—" : x.toFixed(1); }
function veraendert(x){ if (x === null || x === undefined) return ""; const d = x - 100; return '<small class="'+(d < 0 ? "down" : d > 0 ? "up" : "")+'"> '+(d > 0 ? "+" : "")+d.toFixed(1)+' %</small>'; }

function render(){
  const T = L10N[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  document.title = T.h1 + " – aiapicompare";
  document.querySelectorAll("[data-t]").forEach(function(el){ el.textContent = T[el.dataset.t]; });
  document.querySelectorAll(".langbtns button").forEach(function(b){ b.classList.toggle("active", b.dataset.lang === lang); });
  document.getElementById("mhead").innerHTML = '<tr>'+T.mth.map(function(x,i){ return '<th'+(i?' class="num"':'')+'>'+x+'</th>'; }).join("")+'</tr>';
  if (!PI){
    document.getElementById("svg").innerHTML = ""; document.getElementById("leer").hidden = false; document.getElementById("leer").textContent = T.keine;
    document.getElementById("mbody").innerHTML = ""; document.getElementById("kacheln").innerHTML = ""; return;
  }
  const letzter = PI.punkte[PI.punkte.length - 1];
  document.getElementById("kacheln").innerHTML =
    '<div class="kachel"><span>'+T.k_alle+'</span><b>'+wert(letzter[1])+'</b>'+veraendert(letzter[1])+'</div>'+
    '<div class="kachel"><span>'+T.k_top+'</span><b>'+wert(letzter[2])+'</b>'+veraendert(letzter[2])+'</div>'+
    '<div class="kachel"><span>'+T.k_korb+'</span><b>'+PI.n_alle+'</b><small> '+T.k_seit+' '+datum(PI.start)+'</small></div>';
  document.getElementById("mbody").innerHTML = PI.monate.map(function(m){
    return '<tr><td>'+monat(m.m)+'</td><td class="num down">'+m.runter+'</td><td class="num up">'+m.hoch+'</td><td class="num">'+m.neu+'</td></tr>'; }).join("");
  document.getElementById("methode").textContent = T.methode(PI);
  zeichne(T);
}

function zeichne(T){
  const svg = document.getElementById("svg"), tip = document.getElementById("tip"), box = document.getElementById("viz"), leer = document.getElementById("leer");
  const P = PI.punkte;
  leer.hidden = P.length > 1; leer.textContent = T.leer(datum(PI.start));
  if (P.length < 2){ svg.innerHTML = ""; return; }
  const W = 900, H = 340, L = 50, R = 70, O = 14, U = 34;
  const t0 = Date.parse(P[0][0]), t1 = Date.parse(P[P.length-1][0]);
  const werte = [].concat.apply([], P.map(function(p){ return [p[1], p[2]]; })).filter(function(x){ return x !== null; });
  let y0 = Math.floor(Math.min.apply(null, werte.concat([100])) / 5) * 5 - 5, y1 = Math.ceil(Math.max.apply(null, werte.concat([100])) / 5) * 5 + 5;
  const sx = function(d){ return L + (Date.parse(d) - t0) / Math.max(1, t1 - t0) * (W - L - R); };
  const sy = function(v){ return O + (1 - (v - y0) / (y1 - y0)) * (H - O - U); };
  const schritt = (y1 - y0) > 40 ? 10 : 5;
  let h = '<g class="grid">';
  for (let v = y0; v <= y1; v += schritt) h += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+sy(v)+'" y2="'+sy(v)+'"/>';
  h += '</g><g class="achse">';
  for (let v = y0; v <= y1; v += schritt) h += '<text x="'+(L-8)+'" y="'+(sy(v)+4)+'" text-anchor="end">'+v+'</text>';
  const n = Math.min(6, P.length);
  for (let i = 0; i < n; i++){ const p = P[Math.round(i * (P.length - 1) / Math.max(1, n - 1))]; h += '<text x="'+sx(p[0])+'" y="'+(H-12)+'" text-anchor="middle">'+datum(p[0], true)+'</text>'; }
  h += '</g><line x1="'+L+'" x2="'+(W-R)+'" y1="'+sy(100)+'" y2="'+sy(100)+'" stroke="var(--dim)" stroke-width="1"/>';
  [[1, "--c1"], [2, "--c2"]].forEach(function(r){
    const pts = P.filter(function(p){ return p[r[0]] !== null; });
    if (pts.length < 2) return;
    h += '<polyline fill="none" stroke="var('+r[1]+')" stroke-width="2" stroke-linejoin="round" points="'+pts.map(function(p){ return sx(p[0])+","+sy(p[r[0]]); }).join(" ")+'"/>';
    const e = pts[pts.length-1];
    h += '<circle cx="'+sx(e[0])+'" cy="'+sy(e[r[0]])+'" r="4" fill="var('+r[1]+')" stroke="var(--panel)" stroke-width="2"/>';
    h += '<text class="lbl" x="'+(sx(e[0])+8)+'" y="'+(sy(e[r[0]])+4 + (r[0] === 2 && Math.abs(sy(e[1]) - sy(e[2])) < 14 ? (e[2] < e[1] ? 8 : -8) : 0))+'">'+e[r[0]].toFixed(1)+'</text>';
  });
  h += '<line id="kreuz" y1="'+O+'" y2="'+(H-U)+'" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>';
  h += '<rect id="flaeche" x="'+L+'" y="'+O+'" width="'+(W-L-R)+'" height="'+(H-O-U)+'" fill="transparent"/>';
  svg.innerHTML = h;
  svg.setAttribute("aria-label", T.chart_titel);
  const kreuz = svg.querySelector("#kreuz"), fl = svg.querySelector("#flaeche");
  fl.addEventListener("mousemove", function(ev){
    const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * W;
    let best = P[0];
    P.forEach(function(p){ if (Math.abs(sx(p[0]) - x) < Math.abs(sx(best[0]) - x)) best = p; });
    kreuz.setAttribute("x1", sx(best[0])); kreuz.setAttribute("x2", sx(best[0])); kreuz.setAttribute("visibility", "visible");
    tip.innerHTML = '<b>'+datum(best[0])+'</b><br><i style="background:var(--c1)"></i>'+esc(T.reihe_alle)+': '+wert(best[1])+'<br><i style="background:var(--c2)"></i>'+esc(T.reihe_top)+': '+wert(best[2]);
    tip.hidden = false;
    const br = box.getBoundingClientRect(), px = sx(best[0]) / W * r.width + (r.left - br.left);
    tip.style.left = (px + 180 > br.width ? px - 190 : px + 12) + "px"; tip.style.top = "60px";
  });
  fl.addEventListener("mouseleave", function(){ tip.hidden = true; kreuz.setAttribute("visibility", "hidden"); });
}
document.addEventListener("click", function(e){
  const l = e.target.closest("button[data-lang]");
  if (l){ lang = l.dataset.lang; lsSet("lang", lang); render(); }
});
render();
</script>
