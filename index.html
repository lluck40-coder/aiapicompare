  .switch input:checked+span:before{transform:translateX(15px)}
  .resetall{margin-top:1rem;width:100%;padding:.5rem;border:1px solid var(--border2);background:var(--input);border-radius:.45rem;cursor:pointer;color:var(--muted)}

  .count{font-size:.95rem}

  .chip i{font-style:normal;color:var(--muted)}

  .tablewrap{border:1px solid var(--border);border-radius:.6rem;background:var(--panel)}
  thead th:first-child{border-top-left-radius:.6rem}

  table{width:100%;border-collapse:collapse}

  th.sortable:hover{color:var(--fg)}

  tbody tr.row.klick{cursor:pointer}

  .tag.best{background:var(--accent-bg);color:var(--accent);border-color:rgba(74,222,128,.35)}
  .tag.warn{background:rgba(245,158,11,.12);color:#f59e0b;border-color:rgba(245,158,11,.45);cursor:help}

  .refzeile{font-size:.72rem;color:var(--muted);margin:.45rem 0 0}

  .cmptable td{padding:.35rem .5rem;border-bottom:1px dashed var(--border)}

  .empty{padding:3rem;color:var(--muted);text-align:center}
  .more{display:block;margin:1rem auto 0;padding:.6rem 1.4rem;border:1px solid var(--border2);background:var(--panel);border-radius:.5rem;cursor:pointer}
  .more:hover{border-color:var(--accent)}

  /* ---------- Listenansicht (Karten) ---------- */
  .caps{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.35rem}
  .cap{display:inline-flex;align-items:center;gap:.15rem;font-size:.72rem;line-height:1.3;padding:.05rem .32rem;border:1px solid var(--border2);border-radius:.3rem;background:var(--panel2);cursor:help;white-space:nowrap}
  .cap b{font-size:.62rem;font-weight:700;color:var(--blue)}
  .cap.info{color:var(--muted);cursor:default}
  .cap.on{border-color:var(--accent);background:var(--accent-bg)}
  .check .ico{width:1.3rem;text-align:center;flex:none}
  .fhint{font-size:.7rem;color:var(--dim);margin-top:.4rem;line-height:1.4}
  .cards{display:flex;flex-direction:column;gap:.6rem}
  .card{border:1px solid var(--border);border-radius:.6rem;background:var(--panel);padding:.9rem 1rem}
  .card:hover{border-color:var(--border2)}
  .card-top{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}
  .card-stats{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;margin-top:.55rem;font-size:.8rem;color:var(--muted)}

  .card-stats b.best{color:var(--accent)}
  .card .cmpwrap{margin-top:.6rem}

  footer{margin-top:1.5rem;font-size:.74rem;color:var(--dim);line-height:1.6}

  /* Mittlere Breiten: Menü in eine zweite Zeile, damit das Suchfeld Platz behält */
  @media (min-width:901px) and (max-width:1599px){
    .topbar{flex-wrap:wrap;row-gap:.35rem}

  /* ---------- Mobil ---------- */
  .backdrop{display:none}
  @media (max-width:900px){
    .layout{grid-template-columns:1fr}
    aside{position:fixed;left:0;top:0;bottom:0;width:300px;max-width:86vw;height:100vh;z-index:40;background:var(--bg);transform:translateX(-105%);transition:transform .2s;padding-top:1.2rem}
    body.drawer aside{transform:none}
    body.drawer .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30}
    .filterbtn{display:inline-block}
    .brand small{display:none}
    .nav{order:6;flex-basis:100%;overflow-x:auto}
    .topbar{flex-wrap:wrap;gap:.6rem}
    .searchbox{order:5;flex-basis:100%;max-width:none}
    .searchbox kbd{display:none}
    .tablewrap{overflow-x:auto}
    thead th{position:static}
  }
  @media (max-width:640px){
    main{padding:.8rem}
    .tb-right{margin-left:0;width:100%}
    .tb-right select{flex:1;min-width:0}
    .tb-right label{display:none}
  }
</style>

<script>
"use strict";
const D = window.API_DATEN || {};
const C = window.SITE_CONFIG || {kennzeichnung:"Anzeige", hatAffiliate:function(){ return false; },
  linkHtml:function(k,u,t,c){ return u ? '<a class="'+(c||"")+'" href="'+u+'" target="_blank" rel="noopener">'+t+'</a>' : ""; }};

/* =================== Konfiguration =================== */
const QUELLEN = [
  {key:"openrouter",   name:"OpenRouter",   farbe:"#a78bfa"},
  {key:"uplinkswitch", name:"UplinkSwitch", farbe:"#f472b6"},
  {key:"anymodel",     name:"AnyModel",     farbe:"#fbbf24"},
  {key:"nanogpt",      name:"NanoGPT",      farbe:"#34d399"},
  {key:"chutes",       name:"Chutes",       farbe:"#f87171"},
  {key:"deepinfra",    name:"DeepInfra",    farbe:"#60a5fa"},
  {key:"novita",       name:"Novita AI",    farbe:"#2dd4bf"},
  {key:"cometapi",     name:"CometAPI",     farbe:"#fb923c"},
  {key:"kyma",         name:"Kyma API",     farbe:"#c084fc"}
].filter(function(q){ return D[q.key] && Object.keys(D[q.key]).length; });   // nur Anbieter mit Daten anzeigen
const Q_BY_KEY = {}; QUELLEN.forEach(function(q){ Q_BY_KEY[q.key] = q; });

const FAMILIEN = [
  {key:"gpt",      label:"GPT · OpenAI",       tokens:["openai","gpt"]},
  {key:"claude",   label:"Claude · Anthropic", tokens:["anthropic","claude"]},
  {key:"gemini",   label:"Gemini · Google",    tokens:["google","gemini","gemma"]},
  {key:"deepseek", label:"DeepSeek",           tokens:["deepseek"]},
  {key:"grok",     label:"Grok · xAI",         tokens:["xai","grok"]},

/* =================== Daten aufbereiten =================== */
const fameOf = function(entw){ const i = BEKANNT.indexOf(entw); return i < 0 ? 99 : i; };
const zeilen = [];
QUELLEN.forEach(function(q){
  const src = D[q.key] || {};
  Object.keys(src).forEach(function(kanon){
    const v = src[kanon];
    const inp  = (typeof v.in  === "number") ? v.in  : null;
    const outp = (typeof v.out === "number") ? v.out : null;
    const ab   = (inp === null && typeof v.price === "number") ? v.price : null;
    const mp   = (typeof v.media_preis === "number") ? v.media_preis : null;
    const roh  = v.roh_id || kanon;
    let url = v.url || "";
    if (!url && q.key === "openrouter")   url = "https://openrouter.ai/" + roh;
    if (!url && q.key === "uplinkswitch") url = "https://uplinkswitch.ai/models/" + roh;
    let entw = v.entwickler || "";
    if (!entw && roh.indexOf("/") > 0) { const pre = roh.split("/")[0].toLowerCase(); entw = ENTW_MAP[pre] || ""; }
    if (entw && ENTW_MAP[entw.toLowerCase()]) entw = ENTW_MAP[entw.toLowerCase()];
    const name = v.name || v.display_name || roh;
    zeilen.push({
      id: q.key + "|" + kanon, kanon: kanon, qkey: q.key, quelle: q.name, url: url, roh: roh,
      name: name, entw: entw, fame: fameOf(entw),
      context: v.context || 0, inp: inp, outp: outp, ab: ab, media: !!v.media || (inp === null && mp !== null), mp: mp,
      einheit: v.einheit || "", typ: v.typ || ["text"], hinweis: v.hinweis || "", est: !!v.geschaetzt,
      faeh: v.faeh || [], aufl: v.aufl || "", dauer: v.dauer || 0, refmax: v.refmax || 0, dauer_fix: v.dauer_fix || 0,
      gratis: !!v.gratis, seit: v.seit || "", vorher: (typeof v.vorher === "number") ? v.vorher : null,
      preis: inp !== null ? inp : (ab !== null ? ab : (mp !== null ? mp : Infinity)),
      such: (name + " " + q.name + " " + entw + " " + roh + " " + kanon).toLowerCase()
    });
  });
});
// Referenzpreis: Angebote weit darunter und veraltete Daten (referenz.js)
zeilen.forEach(function(z){
  const RF = window.REFERENZ, e = RF ? RF.pruefe(z.qkey, z.kanon) : null, a = RF ? RF.alt(z.qkey) : null;

});
// Videos: Preis auf "pro Sekunde" umrechnen, damit "pro Sekunde" und "pro Generierung" vergleichbar werden
zeilen.forEach(function(z){
  z.ps = null;
  if (z.typ.indexOf("video") >= 0 && z.mp !== null && z.inp === null) {
    if (z.einheit === "second") z.ps = z.mp;
    else if (z.einheit === "generation" && z.dauer_fix) z.ps = z.mp / z.dauer_fix;
    if (z.ps !== null) z.preis = z.ps;

  z.haupt = z.inp !== null ? z.inp : (z.ab !== null ? z.ab : z.mp);
});
const STAND = ((D.meta && D.meta.erstellt) || "").slice(0, 10);

(window.BEREICHE || []).forEach(function(b){ BEREICH_BY_KEY[b.k] = b; });
function istNeu(z){ return z.seit && STAND && (Date.parse(STAND) - Date.parse(z.seit)) <= 7 * 864e5; }
function modellSlug(k){ return String(k).replace(/^media-/, "").toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, ""); }
function sprachPfad(){ return lang === "en" ? "" : lang + "/"; }
// Gruppen je Modell (kanon) – für "günstigster" und Vergleich
const gruppen = {};

zeilen.forEach(function(z){ z.basis = z.kanon.replace(/:free$/, ""); });
zeilen.forEach(function(z){ z.gkey = z.basis + (z.inp === null && z.ab === null && z.mp !== null ? "|" + (z.ps !== null ? "second" : z.einheit) : ""); });
zeilen.forEach(function(z){ (gruppen[z.gkey] = gruppen[z.gkey] || []).push(z); });
Object.keys(gruppen).forEach(function(k){
  const alle = gruppen[k].filter(function(z){ return z.preis !== Infinity; });
  const g = alle.filter(function(z){ return z.ok; });   // ohne Angebote weit unter Referenzpreis / veraltete Daten
  const minAlle = alle.length ? Math.min.apply(null, alle.map(function(z){ return z.preis; })) : Infinity;
  const min = g.length ? Math.min.apply(null, g.map(function(z){ return z.preis; })) : Infinity;
  const bez = g.filter(function(z){ return z.preis > 0; });
  const minBez = bez.length ? Math.min.apply(null, bez.map(function(z){ return z.preis; })) : Infinity;   // Bezug für "+x %" (ohne Gratis-Angebote)
  gruppen[k].forEach(function(z){
    z.anz = gruppen[k].length; z.minPreis = min; z.minBezahlt = minBez;
    z.best = z.ok && z.preis !== Infinity && z.preis === min && alle.length > 1;
    z.istMin = g.length ? (z.ok && z.preis === min) : (z.preis !== Infinity && z.preis === minAlle);   // für "Nur günstigster Anbieter"
  });
});

/* =================== Zustand (in URL gespeichert) =================== */
const DEFAULT = {q:"", anb:[], typ:[], fam:[], cap:[], ctx:0, pmax:PREIS_STEPS.length-1, sort:"preis", dir:"asc", best:false, multi:false, gratis:false, ohneAuff:false, view:"table"};
let S = JSON.parse(JSON.stringify(DEFAULT));
let lang = "de";
let limit = 100;
const offen = {};   // aufgeklappte Vergleiche

function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

function ladeZustand(){
  lang = lsGet("lang") || ((navigator.language || "").slice(0,2) === "de" ? "de" : (navigator.language || "").slice(0,2) === "ru" ? "ru" : (navigator.language || "").slice(0,2) === "zh" ? "zh" : "en");
  if (!I18N[lang]) lang = "en";
  const v = lsGet("view"); if (v) S.view = v; else if (window.innerWidth < 700) S.view = "list";
  const h = location.hash.replace(/^#/, "");
  if (!h) return;
  const p = new URLSearchParams(h);
  if (p.has("q")) S.q = p.get("q");
  ["anb","typ","fam","cap"].forEach(function(k){ if (p.get(k)) S[k] = p.get(k).split(","); });
  if (p.has("ctx"))  S.ctx  = Math.max(0, Math.min(CTX_STEPS.length-1, +p.get("ctx") || 0));
  if (p.has("pmax")) S.pmax = Math.max(0, Math.min(PREIS_STEPS.length-1, +p.get("pmax")));
  if (p.has("sort")) S.sort = p.get("sort");
  if (p.has("dir"))  S.dir  = p.get("dir") === "desc" ? "desc" : "asc";
  S.best  = p.get("best") === "1";
  S.multi = p.get("multi") === "1";
  S.gratis = p.get("gratis") === "1";
  S.ohneAuff = p.get("ohneauff") === "1";
  if (p.has("view")) S.view = p.get("view");
}
function speichereZustand(){
  const p = new URLSearchParams();
  if (S.q) p.set("q", S.q);
  ["anb","typ","fam","cap"].forEach(function(k){ if (S[k].length) p.set(k, S[k].join(",")); });
  if (S.ctx) p.set("ctx", S.ctx);
  if (S.pmax !== DEFAULT.pmax) p.set("pmax", S.pmax);
  if (S.sort !== DEFAULT.sort || S.dir !== DEFAULT.dir){ p.set("sort", S.sort); p.set("dir", S.dir); }
  if (S.best) p.set("best","1");
  if (S.gratis) p.set("gratis","1");
  if (S.multi) p.set("multi","1");
  if (S.ohneAuff) p.set("ohneauff","1");
  const s = p.toString();
  try { history.replaceState(null, "", s ? "#" + s : location.pathname + location.search); } catch(e){}
}

/* =================== Hilfsfunktionen =================== */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtPreis(n){ if (n === null || n === Infinity) return "—"; return "$" + (n >= 100 ? n.toFixed(0) : n >= 1 ? n.toFixed(2) : n >= 0.01 ? n.toFixed(3) : n.toFixed(4)); }
function fmtCtx(n){
  if (!n) return "—";
  if (n >= 1000000) return (n/1000000).toFixed(n % 1000000 ? 2 : 0).replace(/\.?0+$/,"") + "M";
  if (n >= 1000) return Math.round(n/1000) + "K";
  return String(n);
}
function famMatch(z, key){
  const f = FAMILIEN.find(function(x){ return x.key === key; });
  return f && f.tokens.some(function(t){ return z.such.indexOf(t) !== -1; });
}
function T(){ return I18N[lang]; }

/* =================== Filtern & Sortieren =================== */
function filtere(ohne){
  const q = S.q.trim().toLowerCase();
  const qn = q.replace(/[.\s_]+/g, "-");
  const maxP = PREIS_STEPS[S.pmax];
  const minC = CTX_STEPS[S.ctx];
  return zeilen.filter(function(z){
    if (ohne !== "anb" && S.anb.length && S.anb.indexOf(z.qkey) < 0) return false;
    if (ohne !== "typ" && S.typ.length && !z.typ.some(function(t){ return S.typ.indexOf(t) >= 0; })) return false;
    if (ohne !== "cap" && S.cap.length && !S.cap.every(function(c){ return z.faeh.indexOf(c) >= 0; })) return false;
    if (ohne !== "fam" && S.fam.length && !S.fam.some(function(f){ return famMatch(z, f); })) return false;
    if (minC && z.context < minC) return false;
    if (maxP !== Infinity && !(z.preis <= maxP)) return false;
    if (S.best && !z.istMin) return false;
    if (S.ohneAuff && z.auff) return false;
    if (S.multi && z.anz < 2) return false;
    if (S.gratis && !z.gratis) return false;
    if (q && z.such.indexOf(q) < 0 && z.such.replace(/[.\s_]+/g, "-").indexOf(qn) < 0) return false;
    return true;
  });
}
function sortiere(liste){
  const d = S.dir === "desc" ? -1 : 1;
  const num = function(a, b){   // fehlende Werte immer ans Ende
    const ma = (a === null || a === Infinity || a === 0 && S.sort === "kontext"), mb = (b === null || b === Infinity || b === 0 && S.sort === "kontext");
    if (ma && mb) return 0; if (ma) return 1; if (mb) return -1;
    return (a - b) * d;
  };
  const tie = function(a, b){ return (a.fame - b.fame) || a.name.localeCompare(b.name); };
  const cmp = {
    preis:   function(a,b){ return num(a.preis, b.preis) || tie(a,b); },
    output:  function(a,b){ return num(a.outp, b.outp) || num(a.preis, b.preis) || tie(a,b); },
    kontext: function(a,b){ return num(a.context, b.context) || (a.preis - b.preis) || tie(a,b); },
    anbieter:function(a,b){ return a.quelle.localeCompare(b.quelle) * d || (a.preis - b.preis) || tie(a,b); },
    neu:     function(a,b){ return ((b.seit || "") < (a.seit || "") ? -1 : (b.seit || "") > (a.seit || "") ? 1 : 0) || tie(a,b); },
    name:    function(a,b){ return a.name.localeCompare(b.name, undefined, {numeric:true}) * d || (a.preis - b.preis); }
  }[S.sort] || function(){ return 0; };
  return liste.sort(cmp);
}

  if (z.ps !== null) return '<span class="'+cls+'">'+fmtPreis(z.ps)+'<span class="unit">'+esc(t.einheiten.second)+'</span>'+
    '<span class="sub5">≈ '+fmtPreis(z.ps*5)+' '+t.pro5s+(z.einheit === "generation" ? ' · '+fmtPreis(z.mp)+' '+t.gen+' ('+z.dauer_fix+' s)' : '')+'</span></span>';
  if (z.inp !== null) return '<span class="'+cls+'">'+fmtPreis(z.inp)+'</span>';
  if (z.ab !== null)  return '<span class="'+cls+'"><span class="unit">'+t.ab+' </span>'+fmtPreis(z.ab)+'</span>';
  if (z.mp !== null)  return '<span class="'+cls+'">'+(z.est?'<span class="est" title="'+esc(t.geschaetzt)+'">≈</span>':'')+'<span class="unit">'+t.ab+' </span>'+fmtPreis(z.mp)+'<span class="unit">'+esc(t.einheiten[z.einheit] || "")+'</span></span>';
  return '<span class="price">—</span>';
}
function provZelle(z){
  return '<a class="prov provlink" href="anbindung.html#anbieter='+z.qkey+'" title="'+esc(T().einrichten(z.quelle))+'"><span class="dot" style="background:'+Q_BY_KEY[z.qkey].farbe+'"></span><span class="pn">'+esc(z.quelle)+'</span></a>';
}
function goLink(z, mitText){
  return C.linkHtml(z.qkey, z.url, mitText ? T().zum_anbieter + " ↗" : "↗", mitText ? "gotolink" : "extlink", z.quelle);
}
function mnameHtml(z){
  // Klick auf den Namen klappt den Anbieter-Vergleich auf (wenn es mehrere Anbieter gibt)
  const name = z.anz > 1
    ? '<span class="mname" role="button" tabindex="0" data-cmp="'+esc(z.id)+'" title="'+esc(T().cmp_titel)+'">'+esc(z.name)+'</span>'
    : '<span class="mname">'+esc(z.name)+'</span>';
  // Modellseiten gibt es nur in der zusammengebauten Website (build_pages.py setzt MODELLSEITEN)
  if (window.OHNE_MODELLSEITEN || !window.MODELLSEITEN) return name;
  return name + '<a class="mpage" href="'+sprachPfad()+'models/'+modellSlug(z.basis)+'.html" title="'+esc(T().modellseite)+'">ⓘ</a>';
}
function tagsHtml(z, t){
  let h = "";
  if (z.best) h += '<span class="tag best">★ '+t.guenstigster+'</span>';
  if (istNeu(z)) h += '<span class="tag neu">'+t.neu+'</span>';
  // Platzierungen in der Arena-Bestenliste (beste 2 Bereiche unter den ersten 10)
  const sk = window.STAERKEN && window.STAERKEN.modelle ? window.STAERKEN.modelle[z.basis] : null;
  if (sk) Object.keys(sk).filter(function(k){ return sk[k] <= 10 && BEREICH_BY_KEY[k]; })
    .sort(function(a,b){ return sk[a] - sk[b]; }).slice(0, 2).forEach(function(k){
      const b = BEREICH_BY_KEY[k];
      h += '<a class="tag arena" href="bestenliste.html#'+k+'" title="'+esc(t.arena_titel(sk[k], b[lang] || b.en))+'">🏆 #'+sk[k]+' '+esc(b[lang] || b.en)+'</a>';
    });
  if (z.vorher !== null && z.haupt !== null && z.vorher > 0 && z.haupt !== z.vorher) {
    const pz = Math.round((z.haupt / z.vorher - 1) * 100);
    if (pz !== 0) h += '<span class="tag '+(pz < 0 ? "down" : "up")+'" title="'+esc(t.vorher(fmtPreis(z.vorher)))+'">'+(pz < 0 ? "↓ " : "↑ +")+pz+' %</span>';
  }
  z.typ.filter(function(x){ return x !== "text"; }).forEach(function(x){ h += '<span class="tag">'+esc(t.typen[x] || x)+'</span>'; });
  if (window.REFERENZ) h += window.REFERENZ.tags(z.qkey, z.kanon, lang, z.name);
  return h ? '<span class="tags">'+h+'</span>' : "";
}
function cmpBtn(z, t){
  if (z.anz < 2) return '<span class="unit">—</span>';
  return '<button class="cmpbtn'+(offen[z.id]?" open":"")+'" data-cmp="'+esc(z.id)+'">'+t.anbieter_n(z.anz)+' '+(offen[z.id]?"▴":"▾")+'</button>';
}
function vergleichHtml(z, t){
  // erst die regulären Angebote, darunter getrennt die Angebote weit unter dem Referenzpreis
  const g = gruppen[z.gkey].slice().sort(function(a,b){ return (a.auff - b.auff) || (a.preis - b.preis) || a.quelle.localeCompare(b.quelle); });
  const medien = g.some(function(x){ return x.faeh.length || x.aufl || x.dauer; });
  const RT = window.REFERENZ ? window.REFERENZ.txt(lang) : null;
  const spalten = medien ? 4 : 5;
  let trenner = false;
  return '<div style="font-size:.72rem;color:var(--muted);margin:.2rem 0 .3rem">'+t.cmp_titel+'</div>'+
    '<table class="cmptable"><thead><tr><th>'+t.cols.anbieter+'</th><th class="num">'+t.cols.preis+'</th>'+
      (medien ? '<th>'+t.spalte_faeh+'</th>' : '<th class="num">'+t.cols.output+'</th><th class="num">'+t.cols.kontext+'</th>')+'<th></th></tr></thead><tbody>'+
    g.map(function(x){
      const diff = (!x.auff && x.preis !== Infinity && x.preis > 0 && x.minBezahlt > 0 && x.minBezahlt !== Infinity && x.preis > x.minBezahlt) ? '<span class="diff">'+t.teurer(Math.round((x.preis/x.minBezahlt - 1)*100))+'</span>' : "";
      let vor = "";
      if (x.auff && !trenner && RT){ trenner = true; vor = '<tr class="trenner"><td colspan="'+spalten+'">⚠ '+esc(RT.trenner)+'</td></tr>'; }
      return vor + '<tr class="'+(x.id===z.id?"self":"")+'"><td>'+provZelle(x)+' <small class="unit">'+esc(x.name)+'</small>'+(window.REFERENZ ? window.REFERENZ.tags(x.qkey, x.kanon, lang, x.name) : '')+'</td>'+
        '<td class="num">'+preisZelle(x,t)+diff+'</td>'+
        (medien ? '<td>'+(capsHtml(x,t) || '<span class="unit">—</span>')+'</td>' :
          '<td class="num price">'+fmtPreis(x.outp)+'</td><td class="num ctx">'+fmtCtx(x.context)+'</td>')+
        '<td class="num">'+goLink(x,false)+'</td></tr>';
    }).join("")+'</tbody></table>'+
    (RT && !medien && window.REFERENZ.ref(z.basis) ? '<p class="refzeile">'+esc(RT.ref)+': '+esc(window.REFERENZ.refText(z.basis, lang))+' · <a href="methodik.html">'+esc(RT.mehr)+'</a></p>' : '');
}

function renderResults(){
  const t = T();
  const liste = sortiere(filtere());
  document.getElementById("count").innerHTML = t.treffer(liste.length, zeilen.length);
  const box = document.getElementById("results");
  if (!liste.length){ box.innerHTML = '<div class="tablewrap"><div class="empty">'+t.leer+'</div></div>'; return; }
  const sicht = liste.slice(0, limit);
  const rest = liste.length - sicht.length;
  const moreBtn = rest > 0 ? '<button class="more" id="more">'+t.mehr(Math.min(rest, 100))+' ('+rest+')</button>' : "";

  if (S.view === "list"){
    box.innerHTML = '<div class="cards">'+sicht.map(function(z){
      return '<div class="card"><div class="card-top'+(z.anz > 1 ? ' klick" data-cmp="'+esc(z.id) : '')+'"><div>'+
        mnameHtml(z)+tagsHtml(z,t)+
        '<span class="mid">'+esc(z.roh)+(z.hinweis?' · '+esc(z.hinweis):'')+'</span>'+capsHtml(z,t)+'</div><div>'+provZelle(z)+'</div></div>'+
        '<div class="card-stats"><span>'+t.cols.preis+' <b class="'+(z.best?"best":"")+'">'+(z.inp!==null?fmtPreis(z.inp):(z.ab!==null?t.ab+" "+fmtPreis(z.ab):(z.mp!==null?(z.est?"≈ ":"")+t.ab+" "+fmtPreis(z.mp)+(t.einheiten[z.einheit]||""):"—")))+'</b></span>'+
        '<span>'+t.cols.output+' <b>'+fmtPreis(z.outp)+'</b></span>'+
        '<span>'+t.cols.kontext+' <b>'+fmtCtx(z.context)+'</b></span>'+
        (z.entw?'<span>'+esc(z.entw)+'</span>':"")+
        '<span style="margin-left:auto;display:flex;gap:.4rem;align-items:center">'+cmpBtn(z,t)+goLink(z,true)+'</span></div>'+
        (offen[z.id] ? '<div class="cmpwrap">'+vergleichHtml(z,t)+'</div>' : "")+
        '</div>';
    }).join("")+'</div>'+moreBtn;
    return;
  }

  const th = function(key, label, num){
    const aktiv = S.sort === key;
    const pfeil = aktiv ? (S.dir === "asc" ? "▲" : "▼") : "↕";
    return '<th class="sortable'+(num?" num":"")+(aktiv?" active":"")+'" data-sort="'+key+'">'+label+'<span class="arr">'+pfeil+'</span></th>';
  };
  const maxLog = Math.log10(MAXCTX);
  box.innerHTML = '<div class="tablewrap"><table><thead><tr>'+
      th("name", t.cols.name)+th("anbieter", t.cols.anbieter)+th("kontext", t.cols.kontext, true)+
      th("preis", t.cols.preis, true)+th("output", t.cols.output, true)+
      '<th class="num">'+t.cols.cmp+'</th><th></th></tr></thead><tbody>'+
    sicht.map(function(z){
      const breite = z.context ? Math.max(4, Math.min(100, (Math.log10(z.context) - 3) / (maxLog - 3) * 100)) : 0;
      return '<tr class="row'+(z.anz > 1 ? ' klick" data-cmp="'+esc(z.id) : '')+'"><td>'+mnameHtml(z)+tagsHtml(z,t)+
          '<span class="mid">'+esc(z.roh)+(z.entw?' · '+esc(z.entw):"")+(z.hinweis?' · '+esc(z.hinweis):"")+'</span>'+capsHtml(z,t)+'</td>'+
        '<td>'+provZelle(z)+'</td>'+
        '<td class="num"><span class="ctx">'+fmtCtx(z.context)+'</span><span class="ctxbar"><i style="width:'+breite+'%"></i></span></td>'+
        '<td class="num">'+preisZelle(z,t)+'</td>'+
        '<td class="num price">'+fmtPreis(z.outp)+'</td>'+
        '<td class="num">'+cmpBtn(z,t)+'</td>'+
        '<td class="num">'+goLink(z,false)+'</td></tr>'+
        (offen[z.id] ? '<tr class="cmp"><td colspan="7">'+vergleichHtml(z,t)+'</td></tr>' : "");
    }).join("")+'</tbody></table></div>'+moreBtn;
}

function renderChips(){
  const t = T();
  const c = [];
  if (S.q) c.push(['q','',"„"+S.q+"“"]);
  S.anb.forEach(function(k){ c.push(['anb',k,Q_BY_KEY[k] ? Q_BY_KEY[k].name : k]); });
  S.typ.forEach(function(k){ c.push(['typ',k,t.typen[k]||k]); });
  S.cap.forEach(function(k){ c.push(['cap',k,(FAEH[k] ? FAEH[k].ico.replace(/<[^>]+>/g,"")+" " : "")+faehName(k)]); });
  S.fam.forEach(function(k){ const f = FAMILIEN.find(function(x){ return x.key===k; }); c.push(['fam',k,f?f.label:k]); });
  if (S.ctx) c.push(['ctx','',t.cols.kontext+" ≥ "+fmtCtx(CTX_STEPS[S.ctx])]);
  if (PREIS_STEPS[S.pmax] !== Infinity) c.push(['pmax','',"Input ≤ "+fmtPreis(PREIS_STEPS[S.pmax])]);
  if (S.best) c.push(['best','',"★ "+t.guenstigster]);
  if (S.multi) c.push(['multi','',t.nur_mehrere]);
  if (S.gratis) c.push(['gratis','',t.nur_gratis]);
  if (S.ohneAuff) c.push(['ohneAuff','',t.ohne_auff]);
  document.getElementById("chips").innerHTML = c.map(function(x){
    return '<span class="chip" data-chip="'+x[0]+'" data-v="'+esc(x[1])+'">'+esc(x[2])+' <i>✕</i></span>';
  }).join("");
}

function renderStatic(){
  const t = T();
  document.documentElement.lang = lang;
  document.title = t.seitentitel;
  document.getElementById("gratislink").href = (window.MODELLSEITEN ? sprachPfad() : "") + "free.html";
  document.querySelector(".themebtn").title = t.theme;
  document.querySelectorAll("[data-t]").forEach(function(el){ el.textContent = t[el.dataset.t]; });
  document.getElementById("search").placeholder = t.suche;
  document.querySelectorAll(".langbtns button").forEach(function(b){ b.classList.toggle("active", b.dataset.lang === lang); });
  document.querySelector('#viewtog [data-view="table"]').title = t.ansicht_tabelle;
  document.querySelector('#viewtog [data-view="list"]').title = t.ansicht_liste;
  document.getElementById("sortsel").innerHTML = Object.keys(t.sorts).map(function(k){
    return '<option value="'+k+'"'+(k === S.sort+"-"+S.dir ? " selected" : "")+'>'+t.sorts[k]+'</option>';
  }).join("");
  document.querySelectorAll("#viewtog button").forEach(function(b){ b.classList.toggle("active", b.dataset.view === S.view); });
  const alt = Object.keys((D.meta && D.meta.veraltet) || {}).map(function(k){ return Q_BY_KEY[k] ? Q_BY_KEY[k].name : k; });
  document.getElementById("meta").innerHTML = esc(t.meta((D.meta && D.meta.erstellt) || "?") + (alt.length ? " · ⚠ " + t.veraltet(alt.join(", ")) : "")) +
    (window.STAERKEN ? ' · <a href="bestenliste.html" style="color:inherit">' + esc(t.arena_hinweis) + '</a>' : "");
  document.getElementById("footer").textContent = t.footer;
  document.getElementById("infobox").innerHTML = t.infobox;
  const dis = document.getElementById("disclosure");
  dis.hidden = !C.hatAffiliate();
  if (C.hatAffiliate()) dis.innerHTML = '<span class="adlabel">'+esc(C.kennzeichnung)+'</span><span>'+t.disclosure(C.kennzeichnung)+'</span>';
}

function render(resetLimit){
  if (resetLimit) limit = 100;
  renderStatic(); renderSidebar(); renderChips(); renderResults(); speichereZustand();
}

/* =================== Ereignisse =================== */
const $ = function(id){ return document.getElementById(id); };
let suchTimer = null;
$("search").addEventListener("input", function(e){
  clearTimeout(suchTimer);
  suchTimer = setTimeout(function(){ S.q = e.target.value; render(true); }, 120);
});
document.addEventListener("keydown", function(e){
  if (e.key === "/" && document.activeElement !== $("search")) { e.preventDefault(); $("search").focus(); $("search").select(); }
  if (e.key === "Escape") document.body.classList.remove("drawer");
});
$("sortsel").addEventListener("change", function(e){
  const p = e.target.value.split("-"); S.sort = p[0]; S.dir = p[1]; render(true);
});
$("viewtog").addEventListener("click", function(e){
  const b = e.target.closest("button[data-view]"); if (!b) return;
  S.view = b.dataset.view; lsSet("view", S.view); render();
});
document.querySelector(".langbtns").addEventListener("click", function(e){
  const b = e.target.closest("button[data-lang]"); if (!b) return;
  lang = b.dataset.lang; lsSet("lang", lang); render();
});
$("filterbtn").addEventListener("click", function(){ document.body.classList.add("drawer"); });
$("backdrop").addEventListener("click", function(){ document.body.classList.remove("drawer"); });

const sb = $("sidebar");
sb.addEventListener("change", function(e){
  const el = e.target;
  if (el.dataset.g){
    const arr = S[el.dataset.g]; const i = arr.indexOf(el.value);
    if (el.checked && i < 0) arr.push(el.value); if (!el.checked && i >= 0) arr.splice(i, 1);
  } else if (el.id === "bestchk") S.best = el.checked;
  else if (el.id === "multichk") S.multi = el.checked;
  else if (el.id === "gratischk") S.gratis = el.checked;
  else if (el.id === "auffchk") S.ohneAuff = el.checked;
  else if (el.id === "ctxrange") S.ctx = +el.value;
  else if (el.id === "prange") S.pmax = +el.value;
  else return;
  render(true);
});
sb.addEventListener("input", function(e){   // Live-Anzeige beim Ziehen der Regler
  const el = e.target, t = T();
  if (el.id === "ctxrange") el.parentNode.querySelector(".range-val").textContent = +el.value ? "≥ " + fmtCtx(CTX_STEPS[+el.value]) : t.egal;
  if (el.id === "prange")   el.parentNode.querySelector(".range-val").textContent = PREIS_STEPS[+el.value] === Infinity ? t.unbegrenzt : "≤ " + fmtPreis(PREIS_STEPS[+el.value]);
});
sb.addEventListener("click", function(e){
  const c = e.target.closest("[data-clear]");
  if (c){ S[c.dataset.clear] = []; render(true); return; }
  if (e.target.closest("#resetall")){
    const view = S.view; S = JSON.parse(JSON.stringify(DEFAULT)); S.view = view; $("search").value = ""; render(true);
  }
});
$("chips").addEventListener("click", function(e){
  const c = e.target.closest(".chip"); if (!c) return;
  const k = c.dataset.chip, v = c.dataset.v;
  if (k === "q"){ S.q = ""; $("search").value = ""; }
  else if (k === "anb" || k === "typ" || k === "fam" || k === "cap") S[k] = S[k].filter(function(x){ return x !== v; });
  else S[k] = DEFAULT[k];
  render(true);
});
$("results").addEventListener("click", function(e){
  const th = e.target.closest("th[data-sort]");
  if (th){
    const k = th.dataset.sort;
    if (S.sort === k) S.dir = S.dir === "asc" ? "desc" : "asc";
    else { S.sort = k; S.dir = (k === "kontext") ? "desc" : "asc"; }
    render(true); return;
  }
  if (e.target.closest("a")) return;   // Links (Anbieter, Modellseite, Zum Anbieter) nicht abfangen
  if (window.getSelection && String(window.getSelection()).length > 2) return;   // Text markieren erlaubt
  const cb = e.target.closest("[data-cmp]");
  if (cb){ const id = cb.dataset.cmp; offen[id] = !offen[id]; renderResults(); return; }
  if (e.target.id === "more"){ limit += 100; renderResults(); }
});

$("results").addEventListener("keydown", function(e){
  const cb = e.target.closest(".mname[data-cmp]");
  if (cb && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); offen[cb.dataset.cmp] = !offen[cb.dataset.cmp]; renderResults(); }
});

// Höhe der (ggf. zweizeiligen) Kopfleiste für klebende Tabellenköpfe
function kopfHoehe(){ const tb = document.querySelector(".topbar"); if (tb) document.documentElement.style.setProperty("--tbh", tb.offsetHeight + "px"); }
window.addEventListener("resize", kopfHoehe);

ladeZustand();
$("search").value = S.q;
render(true);
kopfHoehe();
</script>
