  .steps li{counter-increment:s;position:relative;padding:.2rem 0 .55rem 2rem}
  .steps li:before{content:counter(s);position:absolute;left:0;top:.2rem;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--panel2);border:1px solid var(--border2);font-size:.72rem;display:flex;align-items:center;justify-content:center;color:var(--accent)}

/* ================= Zustand ================= */
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function startSprache(){
  const g = lsGet("lang") || (navigator.language || "").slice(0,2);
  return L10N[g] ? g : (g === "de" ? "de" : "en");   // z. B. Russisch -> Englisch
}
let lang = startSprache();
let S = {anb:"openrouter", tool:"hermes", modell:""};
function ladeHash(){
  const p = new URLSearchParams(location.hash.replace(/^#/, ""));
  if (p.get("anbieter") && ANBIETER[p.get("anbieter")]) S.anb = p.get("anbieter");
  if (p.get("tool")) S.tool = p.get("tool");
  if (p.get("modell")) S.modell = p.get("modell");
}
function speichereHash(){
  const p = new URLSearchParams({anbieter:S.anb, tool:S.tool});
  if (S.modell) p.set("modell", S.modell);
  try { history.replaceState(null, "", "#" + p.toString()); } catch(e){}
}

/* ================= Modelle aus den Preisdaten ================= */
const BEVORZUGT = /(deepseek|glm|qwen|kimi|claude|gpt|gemini|minimax)/i;
function modelleFuer(k){
  const src = D[k] || {};
  return Object.keys(src).map(function(kk){ return src[kk]; })
    .filter(function(v){ return !v.media && (v.typ || ["text"]).indexOf("text") >= 0 && v.roh_id; })
    .sort(function(a,b){
      const pa = BEVORZUGT.test(a.roh_id) ? 0 : 1, pb = BEVORZUGT.test(b.roh_id) ? 0 : 1;
      return (pa - pb) || ((a.in || a.price || 99) - (b.in || b.price || 99));
    });
}
function standardModell(k){
  const l = modelleFuer(k);
  const gut = l.filter(function(v){ return /(glm|deepseek)/i.test(v.roh_id) && !/(:|thinking|free)/i.test(v.roh_id) && (v.context || 0) >= 128000; });
  return (gut[0] || l[0] || {roh_id:"MODEL-ID"}).roh_id;
}
function modellInfo(k, id){
  const src = D[k] || {};
  for (const kk in src) if (src[kk].roh_id === id) return src[kk];
  return null;
}

function code(lbl, txt){
  codeNr++;
  return '<div class="code"><span class="lbl">'+esc(lbl)+'</span><button class="btn copy" data-copy="c'+codeNr+'">'+L10N[lang].kopieren+'</button><pre id="c'+codeNr+'">'+esc(txt)+'</pre></div>';
}

  }},
  {id:"cursor", fn:function(a, m, ctx, T){
    return T.h.cursor(esc(a.name), esc(a.url), esc(m)) + note(T.h.cursor_note, true);
  }},
  {id:"openwebui", fn:function(a, m, ctx, T){ return T.h.owui(esc(a.url), esc(m)); }},
  {id:"aider", fn:function(a, m, ctx, T){
    const key = T.key_platzhalter;
    return T.h.aider_titel + code("Terminal", "aider --model openai/"+m+" \\\n      --openai-api-base "+a.url+" \\\n      --openai-api-key "+key) +
      T.h.aider_env + code("PowerShell", '$env:OPENAI_API_BASE = "'+a.url+'"\n$env:OPENAI_API_KEY  = "'+key+'"\naider --model openai/'+m) + note(T.h.aider_note);
  }},
  {id:"code", fn:function(a, m, ctx, T){
    const r = T.antwort, hi = T.hallo;
    return T.h.code_py + code("Python", 'import os\nfrom openai import OpenAI\n\nclient = OpenAI(\n    base_url="'+a.url+'",\n    api_key=os.environ["'+a.env+'"],\n)\n'+r+' = client.chat.completions.create(\n    model="'+m+'",\n    messages=[{"role": "user", "content": "'+hi+'"}],\n)\nprint('+r+'.choices[0].message.content)') +
      T.h.code_js + code("JavaScript", 'import OpenAI from "openai";\n\nconst client = new OpenAI({\n  baseURL: "'+a.url+'",\n  apiKey: process.env.'+a.env+',\n});\nconst '+r+' = await client.chat.completions.create({\n  model: "'+m+'",\n  messages: [{ role: "user", content: "'+hi+'" }],\n});\nconsole.log('+r+'.choices[0].message.content);') +
      T.h.code_curl + code("Terminal", 'curl '+a.url+'/chat/completions \\\n  -H "Authorization: Bearer $'+a.env+'" \\\n  -H "Content-Type: application/json" \\\n  -d \'{"model": "'+m+'", "messages": [{"role": "user", "content": "'+hi+'"}]}\'') +
      T.h.code_weitere;
  }}
];

/* ================= Darstellung ================= */
function render(){
  const T = L10N[lang];
  const a = ANBIETER[S.anb];
  if (!TOOLS.some(function(t){ return t.id === S.tool; })) S.tool = "hermes";
  const m = (S.modell || "").trim() || standardModell(S.anb);
  const info = modellInfo(S.anb, m);
  const ctx = info && info.context ? info.context : 0;
  const loc = lang === "zh" ? "zh-CN" : lang === "en" ? "en-US" : "de-DE";

  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  document.title = T.nav_anbindung + " – aiapicompare";
  document.querySelectorAll("[data-t]").forEach(function(el){ el.textContent = T[el.dataset.t]; });
  document.querySelectorAll("[data-h]").forEach(function(el){ el.innerHTML = T[el.dataset.h]; });
  document.querySelectorAll(".langbtns button").forEach(function(b){ b.classList.toggle("active", b.dataset.lang === lang); });


  document.getElementById("provs").innerHTML = REIHENFOLGE.map(function(k){
    const n = modelleFuer(k).length;
    return '<button class="prov'+(k===S.anb?" active":"")+'" data-anb="'+k+'"><span class="dot" style="background:'+ANBIETER[k].farbe+'"></span>'+ANBIETER[k].name+'<small>'+n+' '+T.modelle+'</small></button>';
  }).join("");

  const liste = modelleFuer(S.anb);
  document.getElementById("modelle").innerHTML = liste.slice(0, 800).map(function(v){
    return '<option value="'+esc(v.roh_id)+'">'+esc(v.name || "")+'</option>';
  }).join("");
  const inp = document.getElementById("modell");
  if (document.activeElement !== inp) inp.value = m;
  document.getElementById("modellhint").innerHTML = info
    ? esc(info.name || "") + (ctx ? " · " + T.kontext + " " + ctx.toLocaleString(loc) : "") + (typeof info.in === "number" ? " · $" + info.in + " / 1M " + T.input : "")
    : (liste.length ? T.hint_eigen : T.hint_leer);

  document.getElementById("kontocard").innerHTML = '<h3>'+T.schritt3+'</h3><div style="display:flex;flex-wrap:wrap;gap:.4rem">' +
    C.linkHtml(S.anb, null, T.konto, "btn", a.name) +
    (a.keys ? '<a class="btn" href="'+a.keys+'" target="_blank" rel="noopener">'+T.keylink+'</a>' : "") +
    '<a class="btn" href="'+a.docs+'" target="_blank" rel="noopener">'+T.doku+'</a></div>' +
    '<div class="hint">'+T.preise_link.replace("{k}", S.anb)+'</div>';

  document.getElementById("tabs").innerHTML = TOOLS.map(function(t){
    return '<button data-tool="'+t.id+'" class="'+(t.id===S.tool?"active":"")+'">'+T.tools[t.id]+'</button>';
  }).join("");
  document.getElementById("facts").innerHTML =
    '<div class="fact"><span>'+T.fact_url+'</span><b>'+esc(a.url)+'</b></div>' +
    '<div class="fact"><span>'+T.fact_key+'</span><b>'+esc(a.key)+'</b></div>' +
    '<div class="fact"><span>'+T.fact_modell+'</span><b>'+esc(m)+'</b></div>' +
    '<div class="fact"><span>'+T.fact_env+'</span><b>'+esc(a.env)+'</b></div>';
  codeNr = 0;
  const tool = TOOLS.find(function(t){ return t.id === S.tool; });
  document.getElementById("anleitung").innerHTML = '<div class="card">' + tool.fn(a, m, ctx, T) +
    note('<b>'+esc(a.name)+':</b> '+esc(a.info[lang] || a.info.en)) +
    (S.anb === "anymodel" ? note(T.anymodel_hint, true) : "") + '</div>';

  document.getElementById("uebersicht").innerHTML = REIHENFOLGE.map(function(k){
    const x = ANBIETER[k];
    return '<tr class="'+(k===S.anb?"sel":"")+'"><td><span class="dot" style="background:'+x.farbe+'"></span><a href="#anbieter='+k+'&tool='+S.tool+'" data-anb="'+k+'">'+x.name+'</a></td><td>'+esc(x.url)+'</td><td>'+esc(x.key)+'</td><td>'+esc(x.info[lang] || x.info.en)+'</td><td>'+C.linkHtml(k, null, T.zum, "btn", x.name)+'</td></tr>';
  }).join("");
  speichereHash();
}

/* ================= Ereignisse ================= */
document.addEventListener("click", function(e){
  const l = e.target.closest("button[data-lang]");
  if (l){ lang = l.dataset.lang; lsSet("lang", lang); render(); return; }
  const p = e.target.closest("[data-anb]");
  if (p){ e.preventDefault(); S.anb = p.dataset.anb; S.modell = ""; render(); window.scrollTo({top:0, behavior:"smooth"}); return; }
  const t = e.target.closest("[data-tool]");
  if (t){ S.tool = t.dataset.tool; render(); return; }
  const c = e.target.closest("[data-copy]");
  if (c){
    const T = L10N[lang];
    const txt = document.getElementById(c.dataset.copy).textContent;
    const fertig = function(){ c.textContent = T.kopiert; c.classList.add("ok"); setTimeout(function(){ c.textContent = T.kopieren; c.classList.remove("ok"); }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(fertig, function(){});
    else { const r = document.createRange(); r.selectNodeContents(document.getElementById(c.dataset.copy)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand("copy"); fertig(); }
  }
});
let timer = null;
document.getElementById("modell").addEventListener("input", function(e){
  clearTimeout(timer); timer = setTimeout(function(){ S.modell = e.target.value; render(); }, 250);
});
window.addEventListener("hashchange", function(){ ladeHash(); render(); });
ladeHash();
render();
</script>
<script src="einwilligung.js"></script>
</body>
