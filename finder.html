  nav_vergleich:"Сравнение цен", nav_kosten:"Калькулятор", nav_finder:"Подбор модели", nav_gratis:"Бесплатные модели", nav_best:"Рейтинг", nav_news:"Новости", nav_anbindung:"Подключение", impressum:"Импрессум", datenschutz:"Конфиденциальность",

};

/* ---------- Angebote (wie in der Bestenliste) ---------- */
const ANGEBOTE = {};
Object.keys(QUELLEN).forEach(function(q){
  const src = D[q] || {};
  Object.keys(src).forEach(function(k){
    const v = src[k], basis = k.replace(/:free$/, "");
    const a = {q:q, roh:v.roh_id || k, url:v.url || (q === "openrouter" ? "https://openrouter.ai/" + (v.roh_id || k) : ""),
      inp: typeof v.in === "number" ? v.in : null, ab: (typeof v.in !== "number" && typeof v.price === "number") ? v.price : null,
      mp: typeof v.media_preis === "number" ? v.media_preis : null, e: v.einheit || "", g: !!v.gratis, df: v.dauer_fix || 0};
    a.ps = a.mp !== null ? (a.e === "second" ? a.mp : (a.e === "generation" && a.df ? a.mp / a.df : null)) : null;
    (ANGEBOTE[basis] = ANGEBOTE[basis] || []).push(a);
  });
});
function preisVon(a, art){ if (art === "text") return a.g ? 0 : (a.inp !== null ? a.inp : a.ab); if (art === "bild") return a.e === "image" ? a.mp : null; return a.ps; }
function angebot(keys, art, frei){
  let best = null;
  (keys || []).forEach(function(k){
    if (art !== "text" && !/^media-/.test(k)) return;
    (ANGEBOTE[k] || []).forEach(function(a){
      const p = preisVon(a, art);
      if (p === null || p === undefined) return;
      if (frei ? p !== 0 : p === 0) return;
      if (!best || p < best.p) best = {a:a, p:p, k:k};
    });
  });
  return best;
}
function slug(k){ return String(k).replace(/:free$/, "").replace(/^media-/, "").toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, ""); }

/* ---------- Zustand ---------- */
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
let lang = lsGet("lang") || (navigator.language || "").slice(0,2);
if (!L10N[lang]) lang = "en";
const S = {zweck:"coding", budget:"egal", prio:"ausgewogen"};
function ausHash(){ const p = new URLSearchParams(location.hash.slice(1)); ["zweck","budget","prio"].forEach(function(k){ if (p.get(k)) S[k] = p.get(k); }); }
ausHash();
window.addEventListener("hashchange", function(){ ausHash(); render(); });
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtP(n){ return "$" + (n >= 100 ? n.toFixed(0) : n >= 1 ? n.toFixed(2) : n >= 0.01 ? n.toFixed(3) : n.toFixed(4)); }
function bereichName(k){ const b = (window.BEREICHE || []).filter(function(x){ return x.k === k; })[0]; return b ? b.ico + " " + (b[lang] || b.en) : k; }
function pfad(){ return lang === "en" ? "" : lang + "/"; }

function vorschlaege(){
  const B = ST.bereiche[S.zweck]; if (!B) return [];
  const art = B.art, frei = S.budget === "frei", grenze = BUDGET[S.budget][art];
  let kand = B.liste.map(function(x){ return {x:x, o:angebot(x.k, art, frei)}; }).filter(function(z){ return z.o && (frei || z.o.p <= grenze); });
  if (S.prio === "qualitaet") return kand.slice(0, 3);
  if (S.prio === "preis") return kand.filter(function(z){ return z.x.p <= 20; }).sort(function(a, b){ return a.o.p - b.o.p || a.x.p - b.x.p; }).slice(0, 3);
  // ausgewogen: Punkte und (logarithmischer) Preis gleich gewichtet, nur die ersten 30 Plätze
  kand = kand.filter(function(z){ return z.x.p <= 30 && z.x.r !== null; });
  if (kand.length <= 3) return kand;
  const rs = kand.map(function(z){ return z.x.r; }), ps = kand.map(function(z){ return Math.log10(Math.max(z.o.p, 1e-6)); });
  const rmin = Math.min.apply(null, rs), rmax = Math.max.apply(null, rs), pmin = Math.min.apply(null, ps), pmax = Math.max.apply(null, ps);
  kand.forEach(function(z, i){ z.s = (rmax > rmin ? (z.x.r - rmin) / (rmax - rmin) : 1) - 0.5 * (pmax > pmin ? (ps[i] - pmin) / (pmax - pmin) : 0); });
  return kand.sort(function(a, b){ return b.s - a.s; }).slice(0, 3);
}

function render(){
  const T = L10N[lang];

  document.querySelectorAll("[data-t]").forEach(function(el){ el.textContent = T[el.dataset.t]; });
  document.querySelectorAll(".langbtns button").forEach(function(b){ b.classList.toggle("active", b.dataset.lang === lang); });
  const dis = document.getElementById("disclosure");
  dis.hidden = !C.hatAffiliate();
  if (C.hatAffiliate()) dis.innerHTML = '<span class="adlabel">'+esc(C.kennzeichnung)+'</span><span>'+T.disclosure(C.kennzeichnung)+'</span>';
  if (!BUDGET[S.budget]) S.budget = "egal";
  if (!T.prio[S.prio]) S.prio = "ausgewogen";
  if (!ST){ document.getElementById("ergebnis").innerHTML = '<div class="leer">'+T.keine+'</div>'; return; }
  const zwecke = ZWECKE.filter(function(k){ return ST.bereiche[k]; });
  if (zwecke.indexOf(S.zweck) < 0) S.zweck = zwecke[0];
  const art = ST.bereiche[S.zweck].art;
  const chips = function(id, liste, key, label){ document.getElementById(id).innerHTML = liste.map(function(k){
    return '<button data-k="'+key+'" data-v="'+k+'" class="'+(S[key] === k ? "active" : "")+'">'+esc(label(k))+'</button>'; }).join(""); };
  chips("c1", zwecke, "zweck", bereichName);
  chips("c2", Object.keys(BUDGET), "budget", function(k){ return T.budget[k]; });
  chips("c3", Object.keys(T.prio), "prio", function(k){ return T.prio[k]; });
  document.getElementById("f2u").textContent = T.budget_info[art];
  document.getElementById("warum").textContent = T.warum[S.prio];
  const v = vorschlaege();
  let h;
  if (!v.length) h = '<div class="leer">'+(S.budget === "frei" && art !== "text" ? T.frei_media : T.leer)+'</div>';
  else h = '<div class="ergebnisse">' + v.map(function(z, i){
    const a = z.o.a, preis = z.o.p === 0 ? esc(T.gratis) : esc(T.ab + " " + fmtP(z.o.p)) + '<small>' + esc(art === "text" && a.inp === null && !a.g ? T.pauschal : T.pro[art]) + '</small>';
    const name = z.x.n;
    return '<div class="vorschlag'+(i === 0 ? " erste" : "")+'"><span class="nr">'+T.vorschlag+' '+(i+1)+'</span>'+
      '<span class="name">'+esc(name)+'</span>'+
      '<span class="preis">'+preis+'</span>'+
      '<span class="info">'+T.bei+' '+esc(QUELLEN[a.q])+' · '+esc(T.platz(z.x.p))+' · '+(z.x.r || "—")+' '+esc(T.punkte)+'</span>'+
      '<div class="aktionen">'+C.linkHtml(a.q, a.url, T.zum, "btn", QUELLEN[a.q])+
        '<a class="btn" href="index.html#q='+encodeURIComponent(name.replace(/\([^)]*\)/g, "").trim())+'">'+T.vergleichen+'</a>'+
        (window.MODELLSEITEN ? '<a class="btn" href="'+pfad()+'models/'+slug(z.o.k)+'.html">'+T.modellseite+'</a>' : '')+
        (art === "text" ? '<a class="btn" href="kosten.html#modus=text&modell='+encodeURIComponent(name.replace(/\([^)]*\)/g, "").trim())+'">'+T.kosten+'</a>' : '')+
      '</div></div>';
  }).join("") + '</div>';
  document.getElementById("ergebnis").innerHTML = h;
  document.getElementById("hinweis").textContent = T.hinweis(ST.meta);
  try { history.replaceState(null, "", "#zweck=" + S.zweck + "&budget=" + S.budget + "&prio=" + S.prio); } catch(e){}
}
document.addEventListener("click", function(e){
  const l = e.target.closest("button[data-lang]");
  if (l){ lang = l.dataset.lang; lsSet("lang", lang); render(); return; }
  const c = e.target.closest("button[data-k]");
  if (c){ S[c.dataset.k] = c.dataset.v; render(); }
});
render();
</script>
</body>
