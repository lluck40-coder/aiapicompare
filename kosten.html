/* ---------- Daten ---------- */
function slug(k){ return String(k).replace(/:free$/, "").replace(/^media-/, "").toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, ""); }
function sauber(n){ return String(n || "").replace(/^[^:]{1,30}:\s*/, ""); }
const Z = [];
Object.keys(QUELLEN).forEach(function(q){
  const src = D[q] || {};
  Object.keys(src).forEach(function(k){
    const v = src[k];
    const typ = v.typ || ["text"];
    const z = {q:q, kanon:k, name:sauber(v.name || v.roh_id || k), roh:v.roh_id || k, url:v.url || (q === "openrouter" ? "https://openrouter.ai/" + (v.roh_id || k) : ""),
      inp: typeof v.in === "number" ? v.in : null, out: typeof v.out === "number" ? v.out : null,
      ab: (typeof v.in !== "number" && typeof v.price === "number") ? v.price : null,
      mp: typeof v.media_preis === "number" ? v.media_preis : null, einheit:v.einheit || "", typ:typ,
      faeh:v.faeh || [], ctx:v.context || 0, gratis:!!v.gratis, dauer_fix:v.dauer_fix || 0};
    z.ps = null;
    if (typ.indexOf("video") >= 0 && z.mp !== null && z.inp === null) {
      if (z.einheit === "second") z.ps = z.mp;
      else if (z.einheit === "generation" && z.dauer_fix) z.ps = z.mp / z.dauer_fix;
    }
    Z.push(z);
  });
});

(function(){
  const p = new URLSearchParams(location.hash.slice(1));
  ["modus","modell"].forEach(function(k){ if (p.get(k) !== null) S[k] = p.get(k); });
  ["inM","outM","ctx","bilder","clips","sek","ausgabe","anfragen"].forEach(function(k){ if (p.get(k) !== null && !isNaN(+p.get(k))) S[k] = +p.get(k); });
  if (p.get("gratis") === "1") S.gratis = true;
  if (p.get("caps")) S.caps = p.get("caps").split(",");
})();
function speichern(){
  const p = new URLSearchParams({modus:S.modus});
  if (S.modus === "text"){ p.set("inM",S.inM); p.set("outM",S.outM); if (S.modell) p.set("modell",S.modell); if (S.ctx) p.set("ctx",S.ctx); if (S.gratis) p.set("gratis","1"); }

  if (S.modus === "bild") p.set("bilder",S.bilder);
  if (S.modus === "video"){ p.set("clips",S.clips); p.set("sek",S.sek); }
  if (S.caps.length && S.modus !== "text") p.set("caps",S.caps.join(","));
  try { history.replaceState(null, "", "#" + p.toString()); } catch(e){}
}

/* ---------- Berechnung ---------- */
/* Grobe Token-Schätzung ohne fremde Bibliotheken: ~4 Zeichen pro Token (lateinische Schrift),
   ~2,5 Zeichen (Kyrillisch), ~1 Zeichen (Chinesisch/Japanisch/Koreanisch). */
function tokenSchaetzung(t){
  if (!t) return 0;
  const cjk = (t.match(/[\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af]/g) || []).length;
  const kyr = (t.match(/[\u0400-\u04ff]/g) || []).length;
  return Math.ceil(cjk + kyr / 2.5 + (t.length - cjk - kyr) / 4);
}
function ergebnisse(){
  const q = S.modell.trim().toLowerCase();
  let liste = [];
  const inM = S.modus === "token" ? tokenSchaetzung(S.text) * S.anfragen / 1e6 : S.inM;
  const outM = S.modus === "token" ? S.ausgabe * S.anfragen / 1e6 : S.outM;
  if (S.modus === "text" || S.modus === "token") {
    Z.forEach(function(z){
      if (z.typ.indexOf("text") < 0 || z.mp !== null && z.inp === null) return;
      if (z.gratis && !S.gratis) return;
      if (S.ctx && z.ctx < S.ctx) return;
      if (q && (z.name + " " + z.roh + " " + z.kanon).toLowerCase().indexOf(q) < 0) return;
      let kosten = null, preis = "";
      if (z.gratis) { kosten = 0; preis = L10N[lang].gratis; }
      else if (z.inp !== null && z.out !== null) { kosten = inM * z.inp + outM * z.out; preis = fmtP(z.inp) + " / " + fmtP(z.out); }
      else if (z.ab !== null) { kosten = (inM + outM) * z.ab; preis = L10N[lang].ab + " " + fmtP(z.ab) + " · " + L10N[lang].pauschal; }
      if (kosten === null) return;
      liste.push({z:z, kosten:kosten, preis:preis});
    });
  } else {
    const art = S.modus === "bild" ? "bild" : "video";
    Z.forEach(function(z){
      if (z.typ.indexOf(art) < 0 || z.mp === null || z.inp !== null) return;   // nur echte Preise pro Bild/Sekunde
      if (S.caps.some(function(c){ return z.faeh.indexOf(c) < 0; })) return;
      if (art === "bild") {
        if (z.einheit !== "image") return;
        liste.push({z:z, kosten:S.bilder * z.mp, preis:fmtP(z.mp) + L10N[lang].einheit.image});
      } else {
        if (z.ps === null) return;
        liste.push({z:z, kosten:S.clips * S.sek * z.ps, preis:fmtP(z.ps) + L10N[lang].einheit.second});
      }
    });
  }
  liste.sort(function(a,b){ return a.kosten - b.kosten || a.z.name.localeCompare(b.z.name); });
  return liste;
}

/* ---------- Darstellung ---------- */
function render(){
  const T = L10N[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  document.title = T.nav_kosten + " – aiapicompare";
  document.querySelectorAll("[data-t]").forEach(function(el){ el.textContent = T[el.dataset.t]; });
  document.querySelectorAll(".langbtns button").forEach(function(b){ b.classList.toggle("active", b.dataset.lang === lang); });
  document.querySelectorAll("#modi button").forEach(function(b){ b.classList.toggle("active", b.dataset.modus === S.modus); });
  document.getElementById("gratislink").href = (window.MODELLSEITEN ? pfad() : "") + "free.html";
  const dis = document.getElementById("disclosure");
  dis.hidden = !C.hatAffiliate();
  if (C.hatAffiliate()) dis.innerHTML = '<span class="adlabel">'+esc(C.kennzeichnung)+'</span><span>'+T.disclosure(C.kennzeichnung)+'</span>';

  const f = document.getElementById("form");
  const feld = function(id, label, wert, extra){ return '<div><label for="'+id+'">'+label+'</label><input id="'+id+'" type="number" min="0" step="any" value="'+wert+'"'+(extra||"")+'></div>'; };
  if (document.activeElement && f.contains(document.activeElement)) { /* beim Tippen Formular nicht neu bauen */ }
  else if (S.modus === "text") {
    f.innerHTML = feld("inM", T.in_m, S.inM) + feld("outM", T.out_m, S.outM) +
      '<div><label for="modell">'+T.modell+'</label><input id="modell" type="text" value="'+esc(S.modell)+'" placeholder="'+esc(T.modell_ph)+'"></div>' +
      '<div><label for="ctx">'+T.minctx+'</label><select id="ctx">'+CTX_OPT.map(function(c){ return '<option value="'+c+'"'+(c===S.ctx?" selected":"")+'>'+(c ? (c >= 1e6 ? c/1e6+"M" : c/1000+"K") : T.egal)+'</option>'; }).join("")+'</select></div>' +
      '<div><label class="check" style="text-transform:none;font-size:.86rem;letter-spacing:0;color:var(--fg)"><input id="gratis" type="checkbox"'+(S.gratis?" checked":"")+' style="width:auto"> '+T.gratis_mit+'</label></div>';
  } else if (S.modus === "token") {
    f.innerHTML = '<div style="grid-column:1/-1"><label for="text">'+T.text_label+'</label><textarea id="text" rows="7" style="width:100%;padding:.6rem .7rem;border:1px solid var(--border2);border-radius:.45rem;background:var(--input);color:var(--fg);font-size:.92rem" placeholder="'+esc(T.text_ph)+'">'+esc(S.text)+'</textarea></div>' +
      feld("ausgabe", T.ausgabe, S.ausgabe) + feld("anfragen", T.anfragen, S.anfragen) +
      '<div><label for="modell">'+T.modell+'</label><input id="modell" type="text" value="'+esc(S.modell)+'" placeholder="'+esc(T.modell_ph)+'"></div>' +
      '<div><label class="check" style="text-transform:none;font-size:.86rem;letter-spacing:0;color:var(--fg)"><input id="gratis" type="checkbox"'+(S.gratis?" checked":"")+' style="width:auto"> '+T.gratis_mit+'</label></div>';
  } else if (S.modus === "bild") {
    f.innerHTML = feld("bilder", T.bilder, S.bilder);
  } else {
    f.innerHTML = feld("clips", T.clips, S.clips) + feld("sek", T.sek, S.sek);
  }
  document.getElementById("presets").innerHTML = S.modus === "token"
    ? '<span style="font-size:.85rem;color:var(--muted)">' + esc(T.tok_info(tokenSchaetzung(S.text))) + '</span>'
    : T.presets[S.modus].map(function(p, i){ return '<button data-preset="'+i+'">'+esc(p[0])+'</button>'; }).join("");
  const caps = S.modus === "bild" ? CAPS_BILD : S.modus === "video" ? CAPS_VIDEO : [];
  document.getElementById("capf").innerHTML = caps.map(function(c){
    return '<button data-cap="'+c+'" class="'+(S.caps.indexOf(c)>=0?"on":"")+'">'+esc(T.caps[c])+'</button>';
  }).join("");

  const liste = ergebnisse();
  const top = liste.slice(0, 30);
  document.getElementById("thead").innerHTML = '<tr>'+T.th.map(function(h,i){ return '<th'+(i>=3&&i<=5?' class="num"':'')+'>'+h+'</th>'; }).join("")+'</tr>';
  if (!top.length){
    document.getElementById("sieger").innerHTML = "";
    document.getElementById("tbody").innerHTML = '<tr><td colspan="7" style="padding:2rem;text-align:center;color:var(--muted)">'+T.leer+'</td></tr>';
    speichern(); return;
  }
  const b = top[0], teuer = liste[liste.length - 1];
  const spar = teuer.kosten - b.kosten;
  document.getElementById("sieger").innerHTML = '<div class="sieger"><div class="betrag">'+fmtGeld(b.kosten)+'</div><div class="text">'+
    T.sieger(esc(b.z.name), esc(QUELLEN[b.z.q]))+' · '+T.monat+' · '+fmtGeld(b.kosten*12)+' '+T.jahr+
    (spar > 0 && liste.length > 1 ? '<div class="ersparnis">'+T.ersparnis(fmtGeld(spar), Math.round(spar / teuer.kosten * 100))+'</div>' : '')+
    '</div><div>'+C.linkHtml(b.z.q, b.z.url, T.zum, "btn", QUELLEN[b.z.q])+'</div></div>';
  document.getElementById("tbody").innerHTML = top.map(function(r, i){
    const z = r.z;
    return '<tr class="'+(i===0?"erste":"")+'"><td class="rang">'+(i+1)+'</td>'+
      '<td>'+(window.MODELLSEITEN ? '<a class="mlink" href="'+pfad()+'models/'+slug(z.kanon)+'.html">'+esc(z.name)+'</a>' : '<b>'+esc(z.name)+'</b>')+'<br><small style="color:var(--dim);font-family:var(--mono)">'+esc(z.roh)+'</small></td>'+
      '<td><span class="dot" style="background:'+FARBE[z.q]+'"></span>'+esc(QUELLEN[z.q])+'</td>'+
      '<td class="num price">'+esc(r.preis)+'</td><td class="num price monat">'+fmtGeld(r.kosten)+'</td><td class="num price">'+fmtGeld(r.kosten*12)+'</td>'+
      '<td class="num">'+C.linkHtml(z.q, z.url, "↗", "btn", QUELLEN[z.q])+'</td></tr>';
  }).join("");
  speichern();
}

/* ---------- Ereignisse ---------- */
document.addEventListener("click", function(e){
  const l = e.target.closest("button[data-lang]");
  if (l){ lang = l.dataset.lang; lsSet("lang", lang); document.getElementById("form").innerHTML = ""; render(); return; }
  const m = e.target.closest("button[data-modus]");
  if (m){ S.modus = m.dataset.modus; S.caps = []; document.getElementById("form").innerHTML = ""; render(); return; }
  const p = e.target.closest("button[data-preset]");
  if (p){
    const v = L10N[lang].presets[S.modus][+p.dataset.preset];
    if (S.modus === "text"){ S.inM = v[1]; S.outM = v[2]; }
    else if (S.modus === "bild") S.bilder = v[1];
    else { S.clips = v[1]; S.sek = v[2]; }
    document.getElementById("form").innerHTML = ""; if (document.activeElement) document.activeElement.blur(); render(); return;
  }
  const c = e.target.closest("button[data-cap]");
  if (c){ const i = S.caps.indexOf(c.dataset.cap); if (i >= 0) S.caps.splice(i,1); else S.caps.push(c.dataset.cap); render(); }
});
document.getElementById("form").addEventListener("input", function(e){
  const el = e.target;
  if (el.id === "text") S.text = el.value;
  else if (el.id === "modell") S.modell = el.value;
  else if (el.id === "gratis") S.gratis = el.checked;
  else if (el.id === "ctx") S.ctx = +el.value;
  else if (el.id in S) S[el.id] = Math.max(0, +el.value || 0);
  render();
});
document.getElementById("form").addEventListener("change", function(e){
  if (e.target.id === "gratis"){ S.gratis = e.target.checked; render(); }
});
render();
</script>
</body>
</html>
