# Aktualisiert jede Nacht die Preise und veröffentlicht die Website auf GitHub Pages.
# Manuell starten: GitHub → Actions → "Preise aktualisieren & veröffentlichen" → "Run workflow".
name: Preise aktualisieren & veröffentlichen

on:
  schedule:
    - cron: "17 3 * * *"      # täglich 03:17 UTC (04:17 Uhr deutscher Winterzeit)
  workflow_dispatch:           # Knopf "Run workflow"
  push:
    branches: [main]           # nach jedem eigenen Upload sofort neu veröffentlichen

permissions:
  contents: write              # Preisdaten zurück ins Repository schreiben (Preisverlauf)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v6

      - name: Preise von allen Anbietern abrufen
        env:
          ANYMODEL_API_KEY: ${{ secrets.ANYMODEL_API_KEY }}
          NOVITA_API_KEY: ${{ secrets.NOVITA_API_KEY }}
        run: python3 build_data.py

      - name: Preisdaten speichern (ergibt den Preisverlauf)
        run: |
          git config user.name "preis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/data.js out/verlauf.json
          if ! git diff --cached --quiet; then
            git commit -m "Preise $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push || echo "Push übersprungen (Repository hat sich parallel geändert)"
          fi

      - name: Website zusammenstellen (inkl. Modellseiten, Gratis-Seite, Sitemap, JSON-API)
        run: python3 build_pages.py _site

      - name: Website hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
