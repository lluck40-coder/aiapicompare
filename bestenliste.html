/* ---------- Angebote aus den Preisdaten ---------- */
const ANGEBOTE = {};   // Modell-Schlüssel -> Liste von Angeboten
Object.keys(QUELLEN).forEach(function(q){
  const src = D[q] || {};
  Object.keys(src).forEach(function(k){
    const v = src[k], basis = k.replace(/:free$/, "");
    const a = {q:q, roh:v.roh_id || k, url:v.url || (q === "openrouter" ? "https://openrouter.ai/" + (v.roh_id || k) : ""),
      inp: typeof v.in === "number" ? v.in : null, ab: (typeof v.in !== "number" && typeof v.price === "number") ? v.price : null,
      mp: typeof v.media_preis === "number" ? v.media_preis : null, e: v.einheit || "", g: !!v.gratis, df: v.dauer_fix || 0};
    a.ps = a.mp !== null ? (a.e === "second" ? a.mp : (a.e === "generation" && a.df ? a.mp / a.df : null)) : null;
    (ANGEBOTE[basis] = ANGEBOTE[basis] || []).push(a);
  });
});
function preisVon(a, art){
  if (art === "text") return a.g ? 0 : (a.inp !== null ? a.inp : a.ab);
  if (art === "bild") return a.e === "image" ? a.mp : null;
  return a.ps;
}
function bestesAngebot(keys, art){
  let best = null, frei = false;
  (keys || []).forEach(function(k){
    (ANGEBOTE[k] || []).forEach(function(a){
      if (art !== "text" && !/^media-/.test(k)) return;
      const p = preisVon(a, art);
      if (p === null || p === undefined) return;
      if (p === 0) { frei = true; return; }
      if (!best || p < best.p) best = {a:a, p:p};
    });
  });
  return {best:best, frei:frei};
}

  document.getElementById("quelle").innerHTML = T.quelle(ST.meta);

  const B = ST.bereiche[bereich], art = B.art;
  document.getElementById("thead").innerHTML = '<tr>'+T.th.map(function(x,i){ return '<th'+(i===2||i===3||i===4?' class="num"':'')+'>'+x+'</th>'; }).join("")+'</tr>';
  const zeilen = B.liste.map(function(x){ const o = bestesAngebot(x.k, art); return {x:x, best:o.best, frei:o.frei}; });
  // Preis-Tipp: günstigstes bezahltes Angebot unter den ersten 10 Plätzen mit Preis
  let tipp = null;
  zeilen.filter(function(z){ return z.best; }).slice(0, 10).forEach(function(z){ if (!tipp || z.best.p < tipp.best.p) tipp = z; });
  const max = Math.max.apply(null, B.liste.map(function(x){ return x.r || 0; }));
  const min = Math.min.apply(null, B.liste.map(function(x){ return x.r || max; }));
  const sicht = zeilen.filter(function(z){ return !nurPreis || z.best || z.frei; });
  document.getElementById("tbody").innerHTML = sicht.map(function(z){
    const x = z.x;
    const breite = max > min ? Math.round(8 + (x.r - min) / (max - min) * 52) : 30;
    let preis = '<span class="keinpreis">'+T.keinpreis+'</span>';
    if (z.best) preis = '<span class="price">'+T.ab+' '+fmtP(z.best.p)+'</span><span class="org">'+T.pro[art]+'</span><br><small class="org"><span class="dot" style="background:'+FARBE[z.best.a.q]+'"></span>'+esc(QUELLEN[z.best.a.q])+'</small>';
    else if (z.frei) preis = '<span class="price">'+T.gratis+'</span>';
    const tags = (tipp === z ? '<span class="tag tipp" title="'+esc(T.tipp_t)+'">💰 '+T.tipp+'</span>' : '') + (z.frei && z.best ? '<span class="tag frei">'+T.frei+'</span>' : '');
    const link = (z.best || z.frei) ? '<a class="cmp" href="index.html#q='+encodeURIComponent(suchName(x.n))+'">'+T.vergleichen+'</a>' : '';
    return '<tr class="'+(x.p <= 3 ? "top3" : "")+'"><td class="platz">'+x.p+'</td>'+
      '<td><b>'+esc(x.n)+'</b>'+tags+'<br><span class="org">'+esc(x.o)+'</span></td>'+
      '<td class="num"><span class="price">'+(x.r === null ? "—" : x.r)+'</span><span class="bar" style="width:'+breite+'px"></span></td>'+
      '<td class="num org">'+(x.v ? x.v.toLocaleString("de-DE") : "—")+'</td>'+
      '<td class="num">'+preis+'</td><td class="num">'+link+'</td></tr>';
  }).join("");
  zeichneDiagramm(zeilen, art, T, VORHANDEN.filter(function(b){ return b.k === bereich; })[0]);
  try { history.replaceState(null, "", "#" + bereich); } catch(e){}
}

/* ---------- Preis-Leistungs-Diagramm (SVG, ohne fremde Bibliotheken) ---------- */
function kurzName(n){ return String(n).replace(/\s*\([^)]*\)\s*/g, " ").trim(); }
function zeichneDiagramm(zeilen, art, T, b){
  const box = document.getElementById("viz"), svg = document.getElementById("vizsvg"), tip = document.getElementById("viztip");
  const pk = zeilen.filter(function(z){ return z.best && z.x.r !== null; });
  if (pk.length < 3){ box.hidden = true; return; }
  box.hidden = false;
  document.getElementById("viztitel").textContent = T.viz_titel(b[lang] || b.en);
  document.getElementById("vizunter").textContent = T.viz_unter;
  // Preis-Leistungs-Grenze: kein anderes Modell ist günstiger UND besser bewertet
  const sortiert = pk.slice().sort(function(a, c){ return a.best.p - c.best.p || c.x.r - a.x.r; });
  let maxR = -Infinity; const front = [];
  sortiert.forEach(function(z){ if (z.x.r > maxR){ front.push(z); maxR = z.x.r; } });
  const W = 900, H = 380, L = 58, Rr = 20, O = 16, U = 52;
  const lx = pk.map(function(z){ return Math.log10(z.best.p); });
  let x0 = Math.floor(Math.min.apply(null, lx)), x1 = Math.ceil(Math.max.apply(null, lx));
  if (x1 === x0) x1 = x0 + 1;
  const rs = pk.map(function(z){ return z.x.r; });
  let y0 = Math.floor((Math.min.apply(null, rs) - 5) / 10) * 10, y1 = Math.ceil((Math.max.apply(null, rs) + 5) / 10) * 10;
  const sx = function(p){ return L + (Math.log10(p) - x0) / (x1 - x0) * (W - L - Rr); };
  const sy = function(r){ return O + (1 - (r - y0) / (y1 - y0)) * (H - O - U); };
  let h = '<g class="grid">';
  for (let e = x0; e <= x1; e++) h += '<line x1="'+sx(Math.pow(10,e))+'" x2="'+sx(Math.pow(10,e))+'" y1="'+O+'" y2="'+(H-U)+'"/>';
  const schritt = (y1 - y0) > 120 ? 40 : (y1 - y0) > 60 ? 20 : 10;
  for (let r = y0; r <= y1; r += schritt) h += '<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+sy(r)+'" y2="'+sy(r)+'"/>';
  h += '</g><g class="achse">';
  for (let e = x0; e <= x1; e++){ const p = Math.pow(10,e); h += '<text x="'+sx(p)+'" y="'+(H-U+16)+'" text-anchor="middle">$'+(p >= 1 ? p.toFixed(0) : p.toString())+'</text>'; }
  for (let r = y0; r <= y1; r += schritt) h += '<text x="'+(L-8)+'" y="'+(sy(r)+4)+'" text-anchor="end">'+r+'</text>';
  h += '</g><text class="titel-achse" x="'+((L+W-Rr)/2)+'" y="'+(H-12)+'" text-anchor="middle">'+esc(T.achse_x[art])+'</text>';
  h += '<text class="titel-achse" transform="translate(14,'+((O+H-U)/2)+') rotate(-90)" text-anchor="middle">'+esc(T.achse_y)+'</text>';
  // Linie entlang der Grenze
  if (front.length > 1) h += '<polyline fill="none" stroke="var(--c-front)" stroke-width="2" stroke-opacity=".45" points="'+front.map(function(z){ return sx(z.best.p)+","+sy(z.x.r); }).join(" ")+'"/>';
  const istFront = function(z){ return front.indexOf(z) >= 0; };
  // erst die übrigen, dann die Grenz-Punkte obenauf
  pk.filter(function(z){ return !istFront(z); }).concat(front).forEach(function(z){
    const i = zeilen.indexOf(z);
    h += '<circle class="pt" cx="'+sx(z.best.p)+'" cy="'+sy(z.x.r)+'" r="5" fill="var('+(istFront(z) ? "--c-front" : "--c-rest")+')"/>';
    h += '<circle class="hit" data-i="'+i+'" tabindex="0" cx="'+sx(z.best.p)+'" cy="'+sy(z.x.r)+'" r="12"/>';
  });
  // Beschriftung nur für die Grenz-Punkte, ohne Überlappung (sonst nur im Tooltip)
  const belegt = [];
  front.slice().sort(function(a, c){ return c.x.r - a.x.r; }).forEach(function(z){
    const t = kurzName(z.x.n), bw = t.length * 6.4 + 4, bh = 13, cx = sx(z.best.p), cy = sy(z.x.r);
    const versuche = [[cx + 9, cy - 9, "start"], [cx - 9, cy - 9, "end"], [cx + 9, cy + 16, "start"], [cx - 9, cy + 16, "end"]];
    for (let k = 0; k < versuche.length; k++){
      const v = versuche[k], bx = v[2] === "start" ? v[0] : v[0] - bw, by = v[1] - 11;
      if (bx < L || bx + bw > W - Rr || by < 0 || by + bh > H - U) continue;
      const kollidiert = belegt.some(function(q){ return bx < q[0] + q[2] && bx + bw > q[0] && by < q[1] + q[3] && by + bh > q[1]; }) ||
        pk.some(function(o){ const ox = sx(o.best.p), oy = sy(o.x.r); return ox > bx - 4 && ox < bx + bw + 4 && oy > by - 4 && oy < by + bh + 4; });
      if (!kollidiert){ belegt.push([bx, by, bw, bh]); h += '<text class="lbl" x="'+v[0]+'" y="'+v[1]+'" text-anchor="'+v[2]+'">'+esc(t)+'</text>'; break; }
    }
  });
  svg.innerHTML = h;
  svg.setAttribute("aria-label", T.viz_titel(b[lang] || b.en));
  const zeige = function(el){
    const z = zeilen[+el.getAttribute("data-i")];
    tip.innerHTML = '<b>'+esc(z.x.n)+'</b><br>'+esc(T.th[0])+' '+z.x.p+' · '+z.x.r+' '+esc(T.achse_y)+'<br><small>'+T.ab+' '+fmtP(z.best.p)+T.pro[art]+' · '+esc(QUELLEN[z.best.a.q])+'</small>';
    tip.hidden = false;
    const r = box.getBoundingClientRect(), c = el.getBoundingClientRect();
    let left = c.left - r.left + 16, top = c.top - r.top - 10;
    if (left + 260 > r.width) left = c.left - r.left - 270;
    tip.style.left = Math.max(4, left) + "px"; tip.style.top = Math.max(4, top) + "px";
  };
  svg.querySelectorAll(".hit").forEach(function(el){
    el.addEventListener("mouseenter", function(){ zeige(el); });
    el.addEventListener("focus", function(){ zeige(el); });
    el.addEventListener("mouseleave", function(){ tip.hidden = true; });
    el.addEventListener("blur", function(){ tip.hidden = true; });
  });
}

document.addEventListener("click", function(e){
  const l = e.target.closest("button[data-lang]");
  if (l){ lang = l.dataset.lang; lsSet("lang", lang); render(); return; }
  const b = e.target.closest("button[data-b]");
  if (b){ bereich = b.dataset.b; render(); }
});
document.getElementById("nurpreis").addEventListener("change", function(e){ nurPreis = e.target.checked; render(); });
window.addEventListener("hashchange", function(){
  const h = location.hash.replace(/^#/, "");
  if (VORHANDEN.some(function(b){ return b.k === h; }) && h !== bereich){ bereich = h; render(); }
});
render();
</script>
